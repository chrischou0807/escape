 {t:"抽換其他館藏，日記排進待修護名單",e:"策展人換上了另一件館藏。日記留在修護室，照順序慢慢處理。它錯過了這次開幕，但會有下一次。"},

/* ============ 狀態 ============ */
var KEY="restorer.story.v1", S;
function fresh(){ return {role:null,solved:{},hint:{},t0:0,t1:0,seen:{},order:false,choice:-1}; }
function load(){ try{ var s=JSON.parse(localStorage.getItem(KEY)); if(s&&typeof s==="object"&&s.solved)return s; }catch(e){} return fresh(); }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
S=load();
var app=document.getElementById("app");
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function norm(s){ s=String(s); try{s=s.normalize("NFKC");}catch(e){} return s.replace(/\s+/g,"").toUpperCase(); }
function nSolved(){ return Object.keys(S.solved).length; }
function chDone(i){ return CH[i].p.every(function(id){return S.solved[id];}); }
function chOpen(i){ return i===0||chDone(i-1); }
function usedHints(){ var n=0; Object.keys(S.hint).forEach(function(id){ var lv=S.hint[id]; if(lv>=1&&PZ[id].spec!==S.role)n++; if(lv>=2)n++; }); return n; }
function peeks(){ return Object.keys(S.hint).filter(function(id){return S.hint[id]>=3;}).length; }
function top(){ var r=ROLES[S.role]; return '<div class="top"><span class="chip">'+r.ic+' '+r.name+'</span><span class="chip">病歷表 '+nSolved()+' / 20 頁</span><span class="sp"></span><button class="linkbtn" id="menu">重新開始</button></div><div class="bar"><i style="width:'+(nSolved()/20*100)+'%"></i></div>'; }
function bindTop(){ var m=document.getElementById("menu"); if(m)m.onclick=function(){ if(confirm("要清除進度、從頭開始嗎？")){ S=fresh(); save(); title(); } }; }
function show(html){ app.innerHTML='<div class="fade">'+html+'</div>'; window.scrollTo(0,0); bindTop(); }

/* ============ 畫面 ============ */
function title(){
  show('<p class="eyebrow">線上解謎 · 單人或小組</p><h1>神奇修護師<br>缺頁的病歷表</h1><p class="story">一位失聯的修護師、一本被撕掉二十頁的修護紀錄，和一件天亮前必須有答案的文物。</p>'+
   '<div class="paper" style="margin-top:16px"><h3>怎麼玩</h3><p>一共六章、二十道謎題。每解開一題，就找回一頁病歷表。</p><p>進度會自動存在這台裝置上，可以分次玩完。全部完成大約 40 到 60 分鐘。</p></div>'+
   '<button class="btn" id="go">'+(S.role?"繼續上次的進度":"開始")+'</button>');
  document.getElementById("go").onclick=function(){ if(S.role)hub(); else roleSel(); };
}
function roleSel(){
  var h='<p class="eyebrow">報到</p><h2>你是哪一種修護師？</h2><p class="story">修護師依文物的材質分工。和你的專長有關的謎題，你會直接看到「專業直覺」；其他的謎題，第一個提示要問隊友，或是花一次提示機會。</p><div class="roles">';
  Object.keys(ROLES).forEach(function(k){ var r=ROLES[k]; h+='<button class="role" data-role="'+k+'"><div class="ic">'+r.ic+'</div><div class="nm">'+r.name+'</div><div class="ds">'+r.ds+'</div></button>'; });
  h+='</div><p class="small" style="margin-top:14px">小組一起玩時，每個人選不同的角色，遇到不是自己專長的題目就互相問。</p>';
  app.innerHTML='<div class="fade">'+h+'</div>';
  [].forEach.call(app.querySelectorAll("[data-role]"),function(b){ b.onclick=function(){ S.role=b.dataset.role; S.t0=Date.now(); save(); prologue(); }; });
}
function prologue(){
  show(top()+'<p class="eyebrow">序章</p><h2>晚上九點的修護室</h2><p class="story">'+esc(PROLOGUE)+'</p><button class="btn" id="go">走進修護室</button>');
  document.getElementById("go").onclick=function(){ chapter(0); };
}
function hub(){
  if(nSolved()===20){ if(S.choice>=0)return ending(); return S.order?choice():finale(); }
  var h=top()+'<p class="eyebrow">修護紀錄</p><h2>缺頁的病歷表</h2><div class="list">';
  CH.forEach(function(c,i){ var done=chDone(i), open=chOpen(i), n=c.p.filter(function(id){return S.solved[id];}).length;
    h+='<button class="item'+(done?" done":"")+(open?"":" lock")+'" data-ch="'+i+'"><span class="no">第'+"一二三四五六"[i]+'章</span><span>'+esc(c.t)+'</span><span class="st">'+(open?n+" / "+c.p.length:"未開放")+'</span></button>'; });
  h+='</div>';
  show(h);
  [].forEach.call(app.querySelectorAll("[data-ch]"),function(b){ b.onclick=function(){ var i=+b.dataset.ch; if(chOpen(i))chapter(i); }; });
}
function chapter(i){
  var c=CH[i], done=chDone(i);
  var h=top()+'<p class="eyebrow">第'+"一二三四五六"[i]+'章</p><h2>'+esc(c.t)+'</h2><p class="story">'+esc(c.intro)+'</p><div class="list">';
  c.p.forEach(function(id){ var p=PZ[id], ok=S.solved[id]; h+='<button class="item'+(ok?" done":"")+'" data-p="'+id+'"><span class="no">'+id+'</span><span>'+esc(p.t)+(p.spec===S.role?' <span class="small">· 你的專長</span>':'')+'</span><span class="st">'+(ok?"已找回":"調查")+'</span></button>'; });
  h+='</div>';
  if(done){ if(c.outro)h+='<div class="paper" style="margin-top:16px"><h3>這一章的發現</h3><p>'+esc(c.outro)+'</p></div>';
    h+='<button class="btn" id="next">'+(i<CH.length-1?"前往下一章":"把病歷表拼回來")+'</button>'; }
  h+='<button class="btn ghost" id="back">回到病歷表</button>';
  show(h);
  [].forEach.call(app.querySelectorAll("[data-p]"),function(b){ b.onclick=function(){ puzzle(b.dataset.p,i); }; });
  document.getElementById("back").onclick=hub;
  var nx=document.getElementById("next"); if(nx)nx.onclick=function(){ if(i<CH.length-1)chapter(i+1); else finale(); };
}
function puzzle(id,ci){
  var p=PZ[id], mine=(p.spec===S.role), lv=S.hint[id]||0, ok=!!S.solved[id];
  var h=top()+'<p class="eyebrow">第 '+id+' 頁'+(mine?" · 你的專長":"")+'</p><h2>'+esc(p.t)+'</h2><p class="story">'+esc(p.s)+'</p>'+
   '<div class="paper"><div class="puz" id="puz"></div><div style="text-align:center;margin-top:12px"><span class="fmt">'+esc(p.fmt)+'</span></div></div>';
  if(ok){ h+=record(p)+'<button class="btn" id="back">回到這一章</button>'; }
  else { h+='<div class="ans"><input id="in" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="輸入答案"><button id="ok">確認</button></div><div class="msg" id="msg"></div><div class="hints" id="hints"></div><button class="btn ghost" id="back">回到這一章</button>'; }
  show(h);
  var host=document.getElementById("puz"); try{ RENDER[id](host); }catch(e){ host.textContent="（這一題的畫面載入失敗）"; }
  document.getElementById("back").onclick=function(){ chapter(ci); };
  if(ok)return;
  var inp=document.getElementById("in"), msg=document.getElementById("msg");
  function submit(){ var v=norm(inp.value); if(!v)return;
    if(p.a.map(norm).indexOf(v)>=0){ S.solved[id]=true; save(); puzzle(id,ci); }
    else { msg.textContent="不對。再看一次謎面。"; inp.classList.remove("shake"); void inp.offsetWidth; inp.classList.add("shake"); } }
  document.getElementById("ok").onclick=submit; inp.addEventListener("keydown",function(e){ if(e.key==="Enter")submit(); });
  function drawHints(){ var hd=document.getElementById("hints"), lv=S.hint[id]||0, x="";
    if(mine)x+='<div class="hint pro"><b>專業直覺：</b>'+esc(p.h1)+'</div>';
    else if(lv>=1)x+='<div class="hint"><b>提示一：</b>'+esc(p.h1)+'</div>';
    else x+='<button class="btn ghost" id="h1" style="margin-top:0">這題是'+ROLES[p.spec].name+'的專長。問問隊友，或花一次提示機會</button>';
    if(lv>=2)x+='<div class="hint"><b>提示二：</b>'+esc(p.h2)+'</div>';
    else if(mine||lv>=1)x+='<button class="btn ghost" id="h2" style="margin-top:0">還是卡住，再給一個提示</button>';
    if(lv>=3)x+='<div class="hint"><b>答案：</b>'+esc(p.a[0])+'</div>';
    else if(lv>=2)x+='<button class="btn ghost" id="h3" style="margin-top:0">看答案（會記在結算裡）</button>';
    hd.innerHTML=x;
    ["h1","h2","h3"].forEach(function(k,n){ var b=document.getElementById(k); if(b)b.onclick=function(){ S.hint[id]=Math.max(S.hint[id]||0,n+1); save(); drawHints(); }; }); }
  drawHints();
}
function record(p){ return '<div class="paper fade" style="margin-top:14px;border-left:6px solid var(--good)"><h3>找回的病歷表</h3><p>'+esc(p.r)+'</p><p style="color:var(--soft);font-size:14px;border-top:1px dashed #cbbda6;padding-top:8px;margin-top:10px"><b>修護筆記｜</b>'+esc(p.k)+'</p></div>'; }
function finale(){
  if(S.order)return choice();
  var idx=[2,4,0,3,1], k=0;
  var h=top()+'<p class="eyebrow">最後一步</p><h2>把病歷表拼回來</h2><p class="story">二十頁都找到了，但順序是亂的。她是照什麼順序做的？\n\n從第一步開始，依序點下去。</p><div class="list" id="ord">';
  idx.forEach(function(i){ h+='<button class="item" data-s="'+i+'"><span class="no">？</span><span>'+esc(STEPS[i])+'</span></button>'; });
  h+='</div><div class="msg" id="msg"></div><button class="btn ghost" id="back">回到病歷表的各章</button>';
  show(h);
  document.getElementById("back").onclick=function(){ chapter(CH.length-1); };
  [].forEach.call(app.querySelectorAll("[data-s]"),function(b){ b.onclick=function(){ if(b.classList.contains("done"))return; var i=+b.dataset.s;
    if(i===k){ k++; b.classList.add("done"); b.querySelector(".no").textContent=k; if(k===STEPS.length){ S.order=true; save(); setTimeout(choice,700); } }
    else { document.getElementById("msg").textContent="順序不對，從第一步重新排。想想她在每一章做了什麼。"; k=0; [].forEach.call(app.querySelectorAll("[data-s]"),function(x){x.classList.remove("done");x.querySelector(".no").textContent="？";}); } }; });
}
function choice(){
  var h=top()+'<p class="eyebrow">天快亮了</p><h2>門口傳來腳步聲</h2><p class="story">病歷表拼回來了。最後一頁是她昨天傍晚寫的：\n\n「膠帶比我想的更脆。還沒把它看清楚以前，我不動它。我去找保存科學的同事和策展人，當面談。」\n\n門開了。溫醫師走進來，身後跟著兩個人。她的手機早就沒電了。\n\n「你把它拼回來了。」她笑了。「我把病歷表拆開，一頁一頁留在每個步驟該在的地方。這樣不管誰來接手，都會照順序走一遍。」\n\n策展人看著你：「這本日記是特展的主角。可是它撐不撐得住整個展期，沒有人敢保證。你把整本病歷表都讀過了，你會怎麼建議？」</p><div class="list">';
  CHOICES.forEach(function(c,i){ h+='<button class="item" data-c="'+i+'"><span>'+esc(c.t)+'</span></button>'; });
  h+='</div><p class="small" style="margin-top:12px">這一題沒有標準答案。</p>';
  show(h);
  [].forEach.call(app.querySelectorAll("[data-c]"),function(b){ b.onclick=function(){ S.choice=+b.dataset.c; if(!S.t1)S.t1=Date.now(); save(); ending(); }; });
}
function ending(){
  var c=CHOICES[S.choice], min=Math.max(1,Math.round(((S.t1||Date.now())-S.t0)/60000));
  var h=top()+'<p class="eyebrow">結局</p><h2>早上九點，《歲月痕跡》開幕</h2><p class="story">'+esc(c.e)+'\n\n溫醫師把完整的病歷表交還給你。\n\n「不管選哪一條路，都要大家坐下來談過才行得通。修文物從來不是一個人的事。」\n\n她在封面補上一行字：實習修護師，今天起正式上工。</p>'+
   '<div class="paper" style="margin-top:16px"><h3>你的修護紀錄</h3><p>角色：'+ROLES[S.role].ic+' '+ROLES[S.role].name+'</p><p>找回病歷表：20 / 20 頁</p><p>花費時間：約 '+min+' 分鐘</p><p>使用提示：'+usedHints()+' 次　直接看答案：'+peeks()+' 題</p></div>'+
   '<div class="paper" style="margin-top:12px"><h3>病歷表教我們的事</h3><p>一定先做檢視登錄，再做需要的測試，然後才規劃、執行，而且每一步都要留下紀錄。</p><p>沒有標準的 SOP。每件文物的狀況不同，做法都要跟著調整。</p><p>修護需要木質、紙質、陶瓷各種專長，也需要保存科學人員、策展人一起合作。</p></div>'+
   '<p class="small" style="margin-top:14px">故事裡的人物與博物館是虛構的。修護知識與幸運草日記的案例，取材自台南市文化資產處與故事 StoryStudio 的專文〈我在○○修文物……之外還有很多事〉、〈組隊來治病〉。謎題改編自《神奇修護師》謎題卡。</p>'+
   '<button class="btn ghost" id="review">回頭看每一頁病歷表</button>';
  show(h);
  document.getElementById("review").onclick=function(){ chapter(0); };
}

function H(tag,css,html,parent){ var e=document.createElement(tag); if(css)e.style.cssText=css; if(html!=null)e.innerHTML=html; if(parent)parent.appendChild(e); return e; }
var RENDER={
"09":function(el){ var box=H("div","background:#e9d9b6;border:1px solid #b79c68;border-radius:6px;padding:14px 16px;display:flex;flex-direction:row-reverse;gap:14px;box-shadow:inset 0 0 20px rgba(120,80,20,.25)",null,el);
