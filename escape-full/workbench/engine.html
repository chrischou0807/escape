<!DOCTYPE html>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>小房間逃脫 3D</title>
<style>
:root{--brass:#d9b878;--brass2:#b8935a;--txt:#e7e3da;--dim:#9aa1a9;--line:rgba(255,255,255,.12);
--cjk:"PingFang TC","Microsoft JhengHei","Noto Sans TC","Noto Sans CJK TC",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;margin:0;overflow:hidden;background:#05070a;font-family:var(--cjk);color:var(--txt);touch-action:manipulation}
#app{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;background:#080b10;overflow:hidden}
#gl{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
button{font-family:var(--cjk);cursor:pointer}
#top{position:absolute;top:0;left:0;right:0;height:calc(52px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 12px 0;display:flex;align-items:center;gap:10px;pointer-events:none}
#lvn{flex:1;font-weight:700;font-size:15px;text-shadow:0 1px 4px #000}
.ib{pointer-events:auto;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:rgba(20,26,34,.78);color:var(--brass);font-size:19px;font-weight:700}
#chip{position:absolute;top:calc(56px + env(safe-area-inset-top));left:12px;right:12px;display:none;align-items:center;gap:10px;padding:8px 12px;border-radius:12px;background:rgba(40,32,16,.9);border:1px solid rgba(217,184,120,.5);font-size:14px}
#chip.show{display:flex}
#chip span{flex:1}
#chip button{border:0;background:none;color:var(--brass);font-size:18px}
.rb{position:absolute;bottom:calc(152px + env(safe-area-inset-bottom));width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:rgba(20,26,34,.7);color:var(--txt);font-size:22px}
#rl{left:12px}#rr{right:12px}
#zi,#zo{right:12px;bottom:auto}#zi{top:38%}#zo{top:calc(38% + 54px)}
.zb{position:absolute;right:8px}#izi{bottom:56px}#izo{bottom:8px}
#back{position:absolute;left:12px;right:12px;bottom:calc(92px + env(safe-area-inset-bottom));height:50px;border:0;border-radius:12px;background:linear-gradient(#2e9a5e,#237a49);color:#fff;font-size:18px;font-weight:700;letter-spacing:2px;display:none;box-shadow:0 4px 0 #14502e}
#toast{position:absolute;left:14px;right:14px;bottom:calc(214px + env(safe-area-inset-bottom));z-index:6;background:rgba(10,13,18,.92);border:1px solid rgba(217,184,120,.4);border-radius:12px;padding:11px 14px;font-size:15px;line-height:1.6;text-align:center;opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none}
#toast.show{opacity:1;transform:none}
#inv{position:absolute;left:0;right:0;bottom:0;height:calc(80px + env(safe-area-inset-bottom));padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center;background:linear-gradient(transparent,rgba(5,7,10,.92) 30%)}
.slot{width:62px;height:62px;border-radius:14px;border:1px solid var(--line);background:rgba(30,38,48,.9);padding:2px;display:flex;align-items:center;justify-content:center}
.slot{touch-action:pan-x;user-select:none;-webkit-user-select:none}
.ghost{position:fixed;width:56px;height:56px;margin:-28px 0 0 -28px;opacity:.85;pointer-events:none;z-index:50;filter:drop-shadow(0 4px 8px rgba(0,0,0,.6))}
.slot img{width:100%;height:100%;object-fit:contain;pointer-events:none}
.slot.sel{border-color:var(--brass);box-shadow:0 0 0 2px rgba(217,184,120,.4);background:#2b2416}
.empty{color:var(--dim);font-size:13px;padding-left:4px}
.modal{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(4,6,9,.84)}
.modal.show{display:flex}
.card,.box{width:100%;max-width:350px;background:linear-gradient(#262d36,#1a1f26);border:1px solid var(--line);border-radius:18px;padding:20px;text-align:center}
.card h2{margin:0 0 8px;font-size:21px;color:var(--brass)}
.card p{margin:0 0 16px;line-height:1.8;font-size:15px;white-space:pre-wrap}
.btn{border:0;border-radius:12px;padding:12px 24px;font-weight:700;font-size:15px;background:linear-gradient(var(--brass),var(--brass2));color:#1c1206}
.btn2{border:1px solid var(--line);border-radius:12px;padding:12px 20px;font-size:15px;background:#2a313a;color:var(--txt)}
.title{font-size:34px;font-weight:800;margin:0 0 6px;letter-spacing:3px}
.slots{display:flex;gap:8px;justify-content:center;margin-bottom:14px}
.cs{width:46px;height:54px;border-radius:10px;background:#0e1216;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--brass)}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.kp button{height:50px;border-radius:11px;border:1px solid var(--line);background:#2a313a;color:var(--txt);font-size:22px}
.shake{animation:sk .35s}@keyframes sk{0%,100%{transform:translateX(0)}25%,75%{transform:translateX(-8px)}50%{transform:translateX(8px)}}
.itn{font-size:18px;font-weight:700;color:var(--brass);margin-bottom:8px}
.cvwrap{position:relative;width:100%;aspect-ratio:1;border-radius:14px;background:radial-gradient(circle at 50% 40%,#3a4350,#161b22);overflow:hidden;margin-bottom:10px}
#icv{width:100%;height:100%;display:block;touch-action:none}
.flipb{position:absolute;top:8px;right:8px}
.itd{font-size:14px;line-height:1.7;color:var(--dim);margin-bottom:14px;white-space:pre-wrap;min-height:24px}
.row{display:flex;gap:10px;justify-content:center}
.row .btn,.row .btn2{flex:1}
.paper{background:#f4ead8;color:#3a2e1a;border-radius:8px;padding:16px;margin-bottom:16px;line-height:1.8;font-size:16px;white-space:pre-wrap}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

#mbar{position:absolute;left:12px;right:12px;bottom:calc(150px + env(safe-area-inset-bottom));z-index:5;display:none;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;background:rgba(14,30,22,.92);border:1px solid rgba(80,200,130,.5);font-size:14px;line-height:1.5}
#mbar.show{display:flex}#mbar span{flex:1}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .45s;z-index:40}
#fade.on{opacity:1;pointer-events:auto}
#story{position:absolute;inset:0;z-index:35;display:none;flex-direction:column;justify-content:flex-end;background:#05070a;overflow:hidden}
#story.show{display:flex}
#sbg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.95;transition:opacity .5s}
#sbg::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 35%,rgba(5,7,10,.88) 78%)}
#schars{position:absolute;left:0;right:0;bottom:170px;height:52%;display:flex;align-items:flex-end;justify-content:center;gap:0;pointer-events:none}
.sch{height:100%;max-width:60%;display:flex;align-items:flex-end;transition:opacity .35s,transform .35s,filter .35s}
.sch img{height:100%;width:auto;max-width:100%;object-fit:contain;filter:drop-shadow(0 6px 14px rgba(0,0,0,.6))}
.sch.dim{filter:brightness(.55);transform:scale(.96)}
.sch.left{margin-right:auto}.sch.right{margin-left:auto}
#sbox{position:relative;margin:0 12px calc(18px + env(safe-area-inset-bottom));min-height:136px;padding:14px 16px 12px;border-radius:16px;background:rgba(14,18,24,.92);border:1px solid rgba(217,184,120,.45)}
#sname{font-weight:800;color:var(--brass);margin-bottom:6px;font-size:15px;letter-spacing:1px;min-height:20px}
#stext{font-size:16px;line-height:1.75;white-space:pre-wrap}
#snext{position:absolute;right:14px;bottom:8px;color:var(--brass);animation:bl 1s infinite}
@keyframes bl{50%{opacity:.2}}
#sskip{position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px;z-index:2}
.lvb{display:block;width:100%;margin-bottom:10px;text-align:left}
.lvb small{display:block;font-weight:400;opacity:.75;margin-top:3px}

/* ===== 正式美術：介面層（玻璃質感、暖色黃銅、柔陰影） ===== */
:root{--brass:#e4c283;--brass2:#c19a5b;--txt:#f1ece2;--dim:#a9a39a;--line:rgba(255,255,255,.14);--glass:rgba(34,28,44,.58);--glass2:rgba(52,44,64,.72)}
html,body{background:#0d0a13}
#app{background:#130f1b}
#top{background:linear-gradient(rgba(10,6,18,.55),transparent)}
#lvn{font-size:15px;letter-spacing:1.5px;text-shadow:0 1px 6px rgba(0,0,0,.7)}
.ib,.rb{background:var(--glass);border:1px solid var(--line);color:var(--brass);box-shadow:0 4px 14px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.12);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:transform .12s,background .2s}
.ib:active,.rb:active{transform:scale(.92);background:var(--glass2)}
.rb{color:var(--txt)}
#chip{background:rgba(54,40,20,.82);border:1px solid rgba(228,194,131,.5);box-shadow:0 6px 18px rgba(0,0,0,.4);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
#toast{background:rgba(24,18,34,.86);border:1px solid rgba(228,194,131,.35);box-shadow:0 10px 28px rgba(0,0,0,.45);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-radius:16px}
#inv{background:linear-gradient(transparent,rgba(12,8,20,.78) 38%)}
.slot{background:linear-gradient(rgba(70,60,86,.66),rgba(40,34,54,.72));border:1px solid var(--line);box-shadow:0 4px 10px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.14);border-radius:16px}
.slot.sel{border-color:var(--brass);background:linear-gradient(rgba(110,86,40,.72),rgba(66,50,24,.8));box-shadow:0 0 0 2px rgba(228,194,131,.45),0 0 18px rgba(228,194,131,.35)}
#back{background:linear-gradient(#4fb67c,#2f8c5a);box-shadow:0 5px 0 #1b5b3a,0 10px 22px rgba(0,0,0,.4);border-radius:16px}
#mbar{background:rgba(18,40,30,.86);border-color:rgba(110,214,160,.5);box-shadow:0 8px 22px rgba(0,0,0,.4);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.modal{background:rgba(10,6,18,.72);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.card,.box{background:linear-gradient(rgba(58,48,72,.96),rgba(32,26,44,.98));border:1px solid rgba(255,255,255,.16);border-radius:22px;box-shadow:0 24px 60px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.14)}
.card h2{letter-spacing:2px;text-shadow:0 2px 10px rgba(228,194,131,.25)}
.btn{background:linear-gradient(#f0d598,#c9a05c);color:#2a1a06;box-shadow:0 4px 0 #8c6a30,0 8px 16px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.5);border-radius:14px;transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #8c6a30,0 3px 8px rgba(0,0,0,.35)}
.btn2{background:linear-gradient(rgba(84,74,100,.8),rgba(56,48,72,.85));border:1px solid var(--line);border-radius:14px;box-shadow:0 3px 0 rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.12)}
.btn2:active{transform:translateY(2px)}
.title{text-shadow:0 4px 18px rgba(228,194,131,.35)}
.cs{background:linear-gradient(#17121f,#241d30);border:1px solid var(--line);box-shadow:inset 0 3px 8px rgba(0,0,0,.5)}
.kp button{background:linear-gradient(rgba(84,74,100,.85),rgba(56,48,72,.9));border:1px solid var(--line);border-radius:14px;box-shadow:0 3px 0 rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.12)}
.kp button:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.4)}
.cvwrap{background:radial-gradient(ellipse at 50% 38%,#6a5a78 0%,#3a3048 52%,#1d1728 100%);box-shadow:inset 0 0 40px rgba(0,0,0,.45)}
.cvwrap::after{content:"";position:absolute;left:24%;right:24%;bottom:12%;height:9%;border-radius:50%;background:radial-gradient(rgba(0,0,0,.4),transparent 70%);pointer-events:none}
.itn{letter-spacing:1.5px}
.paper{background:linear-gradient(#f7eedc,#eadfc6);box-shadow:0 6px 16px rgba(0,0,0,.35),inset 0 0 30px rgba(150,110,50,.12)}
#sbg::after{background:linear-gradient(transparent 30%,rgba(12,8,20,.9) 80%)}
.sch img{filter:drop-shadow(0 10px 18px rgba(0,0,0,.55))}
#sbox{background:linear-gradient(rgba(40,32,54,.9),rgba(22,17,32,.94));border:1px solid rgba(228,194,131,.5);border-radius:20px;box-shadow:0 12px 34px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.1);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
#sname:empty{display:none}
#sname{display:inline-block;background:rgba(228,194,131,.16);padding:2px 12px;border-radius:999px;border:1px solid rgba(228,194,131,.35)}
.grp{margin:14px 0 8px;font-weight:800;color:var(--brass);letter-spacing:2px;text-align:left;font-size:14px}
.grp small{color:var(--dim);font-weight:400;letter-spacing:0}
.frags{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 10px}
.fr{font-size:11px;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--dim)}
.fr.on{background:rgba(228,194,131,.2);border-color:rgba(228,194,131,.6);color:var(--brass)}
.lvb.lock{opacity:.5}
.fragnote{color:var(--brass);font-weight:700}
.card{max-height:88vh;overflow:auto}
</style>
</head>

<div id="app">
  <canvas id="gl"></canvas>
  <div id="top"><div id="lvn"></div><button class="ib" id="hintBtn" aria-label="提示">?</button></div>

  <div id="toast"></div>
  <div id="inv"></div>
  <div id="mbar"><span id="mbarT"></span><button class="btn2" id="mbarX" style="padding:6px 12px;font-size:13px">放下</button></div>

</div></div>
<div class="modal" id="modal"><div class="card" id="card"></div></div>

    if(v[0]==="@"&&/^@[\w.]+$/.test(v)){var r=lookup(v.slice(1));return r===undefined?v:r;}
    return tpl(v.replace(/@([A-Za-z][\w.]*)/g,function(m,p){var r=lookup(p);return r==null?m:r;}));
  }
  if(Array.isArray(v))return v.map(resolve);
  if(v&&typeof v==="object"){var o={};Object.keys(v).forEach(function(k){o[k]=resolve(v[k]);});return o;}
  return v;
}

function objBox(n){ // 世界座標包圍盒

  (function w(q,M){var m=mMul(M,q.local());q.parts.forEach(function(p){p.faces.forEach(function(f){f.v.forEach(function(v){var s=mAp(m,v);for(var i=0;i<3;i++){if(s[i]<mn[i])mn[i]=s[i];if(s[i]>mx[i])mx[i]=s[i];}});});});q.kids.forEach(function(c){w(c,m);});})(n,n.parent?worldMat(n.parent):mI());
  return{mn:mn,mx:mx};
}
function worldMatGoal(n){var chain=[];for(var q=n;q;q=q.parent)chain.push(q);var m=mI();
  for(var i=chain.length-1;i>=0;i--){var q2=chain[i],g=q2.goal;m=mMul(m,g&&!q2.mat?mTRS(g.pos||q2.pos,g.rot||q2.rot,g.sc||q2.sc):q2.local());}return m;}
function refocus(){
  if(SIM||focusMode!=="front"||!focusObj)return;
  var rec=SC.obj[focusObj],sf=rec.surfs[rec.focus.surface];if(!sf)return;
  var c=mAp(worldMatGoal(sf.node),[0,0,0]);vgoal.t=[c[0],c[1],c[2]];need=true;
}
function enterFocus(oid){
  var rec=SC.obj[oid],f=rec.focus||{};
  if(focusObj===null)savedAz=vgoal.az;
  focusObj=oid;focusMode=f.mode==="front"?"front":"iso";
  if(focusMode==="front"){
    var sf=rec.surfs[f.surface];
    if(!sf){console.error("front 聚焦缺少 surface: "+oid);focusMode="iso";}
    else{
      var M=worldMat(sf.node),c=mAp(M,[0,0,0]),nz=[M[2],M[6],M[10]],azT=Math.atan2(nz[0],nz[2]),S0=baseS();
      var k=f.k||clamp(Math.min(.86*W/(S0*sf.w),.5*H/(S0*sf.h)),1.2,MAXK);
      vgoal.az=view.az+wrapA(azT-view.az);vgoal.el=f.el!=null?f.el*PI/180:0;vgoal.t=[c[0],c[1],c[2]];vgoal.k=k;
      SC.furn.kids.forEach(function(n){n.hid=(n!==rec.node);});
    }
  }
  if(focusMode==="iso"){
    var b=objBox(rec.node),p=f.p||[(b.mn[0]+b.mx[0])/2,(b.mn[1]+b.mx[1])/2,(b.mn[2]+b.mx[2])/2];
    var sz=Math.max(b.mx[0]-b.mn[0],b.mx[1]-b.mn[1],b.mx[2]-b.mn[2]);
    vgoal.t=p.slice();vgoal.k=f.k||clamp(4.2/Math.max(sz,1),1.5,3);
  }
  updBack();mechTip();
}

function interact(hot){
  var rules=LV.rules[hot]||[];
  for(var i=0;i<rules.length;i++){
    var r=rules[i];if(!cond(r.if))continue;
    var uses=r.if&&r.if.indexOf("using:")>=0,special=r.do.some(function(e){return/^(find|code|ui|note|goto|story):/.test(e);});
    if(ST.sel&&!uses&&!special){sBad();toast("這裡用不上「"+itemName(ST.sel)+"」。");return false;}
    run(resolve(r.do),resolve(r));return true;
  }
  return false;
}
function run(list,rule){
  for(var i=0;i<list.length;i++){
    var e=list[i],p=e.indexOf(":"),k=p<0?e:e.slice(0,p),v=p<0?"":e.slice(p+1),d=REG.effects[k];
    if(!d){console.error("未知效果: "+k);continue;}
    d.run(v,rule||{});
    if(d.stop){applyState();if(!SIM){renderInv();}return;}
  }
  applyState();if(!SIM)renderInv();
}

/* 組合：{a,b,to(字串或陣列),keep:[不消耗的道具],if:條件,fail:條件不符的提示,do:[組合後的效果],msg} */
function tryCombine(x,y){
  var cs=LV.combos||[],blocked=null;
  for(var i=0;i<cs.length;i++){var c=cs[i];
    if((c.a===x&&c.b===y)||(c.a===y&&c.b===x)){
      if(c.if&&!cond(c.if)){blocked=blocked||c;continue;}
      var keep=c.keep||[];
      ST.inv=ST.inv.filter(function(q){return !((q===x||q===y)&&keep.indexOf(q)<0);});
      comboTo(c).forEach(function(t){if(ST.inv.indexOf(t)<0)ST.inv.push(t);});ST.sel=null;
      if(!SIM){chipUpdate();renderInv();applyState();sOK();toast(c.msg||"組合成功！");}
      if(c.do)run(c.do,{});
      return true;}}
  if(!SIM){sBad();toast(blocked?(blocked.fail||"現在還不能這樣組合。"):"這兩樣東西無法組合。");}return false;
}

/* ---------- 線索模型：玩家必須先「看到」答案的每一位，才算有辦法解 ---------- */
function ansKeyOf(v){var A=LV.answers||{},s=JSON.stringify(v);for(var k in A){if(JSON.stringify(A[k])===s||String(A[k])===String(v))return k;}return null;}
function knows(key){
  var A=LV.answers[key],n=Array.isArray(A)?A.length:String(A).length,got={},i;
  (LV.clues||[]).forEach(function(c){
    if(c.key!==key||!cond(c.when))return;
    if(c.index==null||c.index==="*"){for(i=0;i<n;i++)got[i]=1;}else[].concat(c.index).forEach(function(j){got[j]=1;});});
  for(i=0;i<n;i++)if(!got[i])return false;return true;}
function knowsAnswer(v){var k=ansKeyOf(v);return k==null?true:knows(k);}

/* =====================================================================
   自動解題器：用同一套規則模擬，廣度優先找出通關路徑
   ===================================================================== */
function snap(){return JSON.stringify({F:ST.F,inv:ST.inv.slice().sort(),scene:ST.scene});}
function restore(s){var o=JSON.parse(s);ST.F=o.F;ST.inv=o.inv;ST.scene=o.scene;ST.sel=null;ST.won=false;}
function solverActions(){
  var acts=[],sc=SC,hots=Object.keys(sc.hotOwner);
  var sels=[null].concat(ST.inv);
  sels.forEach(function(s){
    hots.forEach(function(h){acts.push({k:"tap",h:h,sel:s});if((LV.rules||{})[h+":hold"])acts.push({k:"tap",h:h+":hold",sel:s});});
    sc.mechs.forEach(function(M){acts.push({k:"mech",M:M,sel:s});});
  });
  for(var i=0;i<ST.inv.length;i++)for(var j=i+1;j<ST.inv.length;j++)acts.push({k:"combo",a:ST.inv[i],b:ST.inv[j]});
  ST.inv.forEach(function(id){if(findSplit(id))acts.push({k:"split",id:id});if(hasShake(id))acts.push({k:"shake",id:id});});
  return acts;
}
function solverLabel(a){
  if(a.k==="tap")return(a.sel?"拿「"+itemName(a.sel)+"」":(/:hold$/.test(a.h)?"長按":"點"))+" → "+a.h.replace(/:hold$/,"");
  if(a.k==="mech")return(a.sel?"拿「"+itemName(a.sel)+"」":"")+"操作機關 "+a.M.id;
  if(a.k==="split")return "拆開「"+itemName(a.id)+"」";
  if(a.k==="shake")return "搖晃「"+itemName(a.id)+"」";
  return "組合 "+itemName(a.a)+" + "+itemName(a.b);
}
function hasNegation(){
  var neg=false;
  Object.keys(LV.rules||{}).forEach(function(h){LV.rules[h].forEach(function(r){if(r.if&&/!|count:\w+(<|=)/.test(r.if))neg=true;});});
  Object.keys(LV.scenes).forEach(function(s){(LV.scenes[s].objects||[]).forEach(function(o){(o.mechs||[]).forEach(function(m){if(m.if&&/!|count:\w+(<|=)/.test(m.if))neg=true;});});});
  return neg;
}
/* 解題：廣度優先。只「增加」旗標/道具的動作視為單調，會自動套用到飽和（避免獨立步驟的排列組合爆炸）；
   會消耗道具、清除旗標、組合、換場景的動作才分支。若規則裡用了「!」否定條件，退回完整搜尋。 */
function solve(maxStates){
  maxStates=maxStates||30000;
  var saved=JSON.stringify(ST),savedSIM=SIM,savedSC=SC;
  SIM=true;
  var startScene=LV.start||Object.keys(LV.scenes)[0],neg=hasNegation(),rt={};
  ST={F:{},inv:[],sel:null,scene:startScene,won:false};
  function sceneRT(id){if(!rt[id]){var keep=SC;buildScene(id);rt[id]=SC;SC=keep;}return rt[id];}
  function enter(){SC=sceneRT(ST.scene);}
  function exec(a){
    if(a.sel&&ST.inv.indexOf(a.sel)<0)return false;
    if(a.k==="combo"&&(ST.inv.indexOf(a.a)<0||ST.inv.indexOf(a.b)<0))return false;
    if((a.k==="split"||a.k==="shake")&&ST.inv.indexOf(a.id)<0)return false;
    if(a.k==="tap"&&!SC.hotOwner[a.h.replace(/:hold$/,"")])return false;
    if(a.k==="mech"&&SC.mechs.indexOf(a.M)<0)return false;
    ST.sel=a.sel;
    if(a.k==="tap")return interact(a.h);
    if(a.k==="mech"){var M=a.M;if(M.active()&&(!M.def.answerOf||knowsAnswer(M.def.answerOf(M)))){run(resolve(M.ok),{});return true;}return false;}
    if(a.k==="split")return trySplit(a.id);
    if(a.k==="shake")return doShake(a.id);
    return tryCombine(a.a,a.b);
  }
  function mono(b,a){var x=JSON.parse(b),y=JSON.parse(a);if(x.scene!==y.scene)return false;
    for(var k in x.F)if(!y.F[k])return false;for(var i=0;i<x.inv.length;i++)if(y.inv.indexOf(x.inv[i])<0)return false;return true;}
  function close(path){
    for(var guard=0;guard<300;guard++){
      var s0=snap(),moved=false;restore(s0);enter();var acts=solverActions();
      for(var i=0;i<acts.length;i++){
        restore(s0);enter();var a=acts[i];
        if(!exec(a))continue;
        if(ST.won){path.push({a:a,l:solverLabel(a)});return true;}
        var s1=snap();if(s1!==s0&&mono(s0,s1)){path.push({a:a,l:solverLabel(a)});moved=true;break;}
      }
      if(!moved){restore(s0);enter();return false;}
    }
    return false;
  }
  var plan=null,seen={},queue=[],count=0,reached={};
  var p0=[];if(!neg&&close(p0))plan=p0;
  var s0=snap();seen[s0]=1;queue.push({s:s0,path:p0});
  while(queue.length&&!plan&&count<maxStates){
    var cur=queue.shift();restore(cur.s);enter();
    var acts=solverActions();
    for(var i=0;i<acts.length&&!plan;i++){
      restore(cur.s);enter();var a=acts[i];
      if(!exec(a))continue;
      var path=cur.path.concat([{a:a,l:solverLabel(a)}]);
      if(ST.won){plan=path;break;}
      var s1=snap();if(s1===cur.s)continue;
      if(!neg){if(close(path)){plan=path;break;}s1=snap();}
      Object.keys(ST.F).forEach(function(f){reached[f]=1;});
      if(seen[s1])continue;seen[s1]=1;count++;queue.push({s:s1,path:path});
    }
  }
  function replay(list){
    ST={F:{},inv:[],sel:null,scene:startScene,won:false};
    for(var i=0;i<list.length;i++){enter();if(!exec(list[i].a))return false;if(ST.won)return true;}
    return ST.won;
  }
  if(plan){for(var q=plan.length-1;q>=0;q--){var tr=plan.slice(0,q).concat(plan.slice(q+1));if(replay(tr))plan=tr;}}
  var res={solvable:!!plan,steps:plan&&plan.map(function(p){return p.l;}),states:count,flags:Object.keys(reached),limit:!plan&&count>=maxStates};
  SIM=savedSIM;SC=savedSC;ST=JSON.parse(saved);
  return res;
}

/* =====================================================================
   關卡檢查：不用人玩，直接從規格找出常見錯誤
   validate() → {errors,warnings,info,solve}
   ===================================================================== */
function validate(){
  var errors=[],warnings=[],info=[];
  var saved=JSON.stringify(ST),savedSC=SC,savedSIM=SIM;SIM=true;
  if(LV.look&&!LOOKS[LV.look])errors.push("look「"+LV.look+"」不存在，可用："+Object.keys(LOOKS).join("、"));
  Object.keys(LV.scenes||{}).forEach(function(k){var r=LV.scenes[k].room;if(r&&r.look&&!LOOKS[r.look])errors.push("場景 "+k+" 的 look「"+r.look+"」不存在");});
  var setF={},readF={},usedItems={},hots={},hotScene={},foundItems={};
  function readCond(s){if(!s)return;String(s).replace(/flag:(\w+)/g,function(m,f){readF[f]=1;});String(s).replace(/(?:using|has):(\w+)/g,function(m,i){usedItems[i]=1;});}
  function scanEff(list,where){
    (list||[]).forEach(function(e){
      var p=e.indexOf(":"),k=p<0?e:e.slice(0,p),v=p<0?"":e.slice(p+1);
      if(!REG.effects[k]){errors.push(where+"：未知效果「"+k+"」");return;}
      if(k==="set"||k==="unset"&&0)setF[v]=1;
      if(k==="find"){var q=v.split("|");foundItems[q[0]]=1;if(q[1])setF[q[1]]=1;if(!REG.items[q[0]])errors.push(where+"：未知道具「"+q[0]+"」");}
      if(k==="give"||k==="take"){if(!REG.items[v])errors.push(where+"：未知道具「"+v+"」");if(k==="take")usedItems[v]=1;if(k==="give")foundItems[v]=1;}
      if(k==="win")setF.open=1;
      if(k==="goto"&&!LV.scenes[v])errors.push(where+"：goto 的場景「"+v+"」不存在");
      if(k==="sound"&&!SND[v])errors.push(where+"：未知音效「"+v+"」");
      if(k==="video"&&!(LV.media&&LV.media[v]))errors.push(where+"：video 的 media「"+v+"」不存在");
      if(k==="speak"&&!((LV.speech||{})[v]))errors.push(where+"：speak「"+v+"」在 speech 區沒有內容");
      if(k==="story"&&!(LV.story&&LV.story[v]))warnings.push(where+"：story「"+v+"」沒有內容");
    });
  }
  (LV.clues||[]).forEach(function(c){readCond(c.when);});(LV.hints||[]).forEach(function(h){readCond(h.if);});
  // 規則
  Object.keys(LV.rules||{}).forEach(function(h){(LV.rules[h]||[]).forEach(function(r,i){
    var w="規則 "+h+"["+i+"]";readCond(r.if);scanEff(r.do,w);scanEff(r.ok,w);});});
  (LV.splits||[]).forEach(function(s,i){var w="拆解 "+(s.item||i);readCond(s.if);scanEff(s.do,w);usedItems[s.item]=1;
    if(!REG.items[s.item])errors.push(w+"：未知道具「"+s.item+"」");(s.to||[]).forEach(function(t){foundItems[t]=1;if(!REG.items[t])errors.push(w+"：未知道具「"+t+"」");});});
  (LV.combos||[]).forEach(function(c,i){var w="組合 "+c.a+"+"+c.b;usedItems[c.a]=1;usedItems[c.b]=1;readCond(c.if);scanEff(c.do,w);
    comboTo(c).forEach(function(t){foundItems[t]=1;});
    [c.a,c.b].concat(comboTo(c)).concat(c.keep||[]).forEach(function(it){if(!REG.items[it])errors.push(w+"：未知道具「"+it+"」");});
    (c.keep||[]).forEach(function(k){if(k!==c.a&&k!==c.b)errors.push(w+"：keep 的「"+k+"」不是參與組合的道具");});
    if(!comboTo(c).length&&!(c.do&&c.do.length))errors.push(w+"：沒有產出道具也沒有效果");
    if(c.a===c.b)errors.push(w+"：兩個道具相同");});
  // 場景
  var sceneIds=Object.keys(LV.scenes);
  if(!LV.scenes[LV.start||sceneIds[0]])errors.push("start 場景不存在");
  sceneIds.forEach(function(sid){
    var sc;try{sc=buildScene(sid);}catch(e){errors.push("場景 "+sid+" 建構失敗："+e.message);return;}
    sc.vis.forEach(function(n){readCond(n.vis);});
    sc.binds.forEach(function(b){readCond(b.when);});
    sc.lights.forEach(function(l){readCond(l.when);});
    sc.mechs.forEach(function(M){readCond(M.if);readCond(M.solved);scanEff(M.spec.ok,"機關 "+M.id);
      if(M.def.check){var ce=M.def.check(M);if(ce)errors.push("機關 "+M.id+"："+ce);}
      var ans=M.def.answerOf&&M.def.answerOf(M);
      if(ans!=null&&ansKeyOf(ans)==null)warnings.push("機關 "+M.id+"：答案不是來自 answers（請改用 @answers.…，以免多處不一致）");});
    Object.keys(sc.hotOwner).forEach(function(h){hots[h]=(hots[h]||0)+1;hotScene[h]=sid;});
    (LV.scenes[sid].objects||[]).forEach(function(o){
      if(!REG.props[o.prop])errors.push("物件 "+o.id+"：未知的道具「"+o.prop+"」，請只用手冊列出的 prop");
      (o.mechs||[]).forEach(function(m){if(!REG.mechs[m.mech])errors.push("物件 "+o.id+"：未知的機關「"+m.mech+"」");});
      var rec=sc.obj[o.id];if(!rec)return;
      var f=o.focus||{};
      if(f.mode==="front"&&!rec.surfs[f.surface])errors.push("物件 "+o.id+"：front 聚焦指定的互動面「"+f.surface+"」不存在");
      (o.mechs||[]).forEach(function(m){if(!rec.surfs[m.surface])errors.push("物件 "+o.id+"：機關 "+m.id+" 指定的互動面「"+m.surface+"」不存在");});
    });
  });
  // 熱點與規則對照
  Object.keys(hots).forEach(function(h){if(!(LV.rules&&(LV.rules[h]||LV.rules[h+":hold"])))warnings.push("熱點「"+h+"」沒有任何規則（點了沒反應）");});
  Object.keys(LV.rules||{}).forEach(function(h){if(/^item:/.test(h)){var iid=h.split(":")[1];if(!REG.items[iid])errors.push("規則「"+h+"」指向不存在的道具");return;}if(!hots[h.replace(/:hold$/,"")])errors.push("規則「"+h+"」沒有對應的熱點（沒有任何零件使用這個 hot id）");});
  // 旗標
  Object.keys(readF).forEach(function(f){if(!setF[f]&&f.indexOf("_seen_")!==0)errors.push("旗標「"+f+"」被當條件使用，但沒有任何效果會設定它");});
  Object.keys(setF).forEach(function(f){if(!readF[f]&&f!=="open")warnings.push("旗標「"+f+"」被設定但沒有任何地方使用");});
  // 道具
  Object.keys(foundItems).forEach(function(i){if(!usedItems[i])info.push("道具「"+i+"」取得後沒有被使用（若是線索道具，這是正常的）");});
  // 答案與線索
  var A=LV.answers||{};

    var n=Array.isArray(A[k])?A[k].length:String(A[k]).length,covered={};
    (LV.clues||[]).forEach(function(c){if(c.key!==k)return;if(c.index==null||c.index==="*")for(var i=0;i<n;i++)covered[i]=1;else[].concat(c.index).forEach(function(j){covered[j]=1;});
      (c.when||"").replace(/flag:(\w+)/g,function(m,f){if(!setF[f])errors.push("線索（"+k+"）的條件旗標「"+f+"」永遠不會成立");});});
    for(var i=0;i<n;i++)if(!covered[i])errors.push("答案「"+k+"」第 "+(i+1)+" 位沒有任何線索（玩家無從得知）");
  });
  (LV.clues||[]).forEach(function(c){if(!(c.key in A))errors.push("線索指向不存在的答案「"+c.key+"」");});
  SIM=savedSIM;SC=savedSC;ST=JSON.parse(saved);
  var sol=solve();
  if(!sol.solvable)errors.push(sol.limit?"解題搜尋超過上限，無法確認可解":"自動解題找不到通關路徑（可能有死路、線索被擋住或旗標順序錯誤）");
  return{errors:errors,warnings:warnings,info:info,solve:sol};
}

/* ---- 撥指針（時鐘） ---- */
defMech("dial",{title:"撥指針",desc:"拖曳時鐘的指針撥到指定時間。靠近中心拖曳是時針，靠外圈是分針。",tip:"拖曳指針：靠近中心是時針，靠外圈是分針",
  params:{target:{type:"string",default:"4:50",desc:"正確時間 H:MM"},start:{type:"string",default:"10:10",desc:"起始時間 H:MM"}},
  example:{mech:"dial",surface:"face",solved:"flag:clockok",params:{target:"@answers.time"},ok:["set:clockok"]},
  answerOf:function(M){return M.P.target;},
  init:function(M){var s=M.P.start.split(":"),t=M.P.target.split(":");M.S.h=(+s[0])%12;M.S.m=+s[1];M.S.th=(+t[0])%12;M.S.tm=+t[1];M.S.mode=null;},
  draw:function(M,g,w,h){
    var hh=M.S.h,mm=M.S.m;if(M.isSolved()){hh=M.S.th;mm=M.S.tm;}
    var cx=w/2,cy=h/2,R=Math.min(w,h)/2;
    function hand(a,len,wid){g.strokeStyle="#222";g.lineWidth=wid;g.lineCap="round";g.beginPath();g.moveTo(cx,cy);g.lineTo(cx+sin(a)*len,cy-cos(a)*len);g.stroke();}
    hand(((hh%12)*30+mm*.5)*PI/180,R*.5,R*.06);hand(mm*6*PI/180,R*.76,R*.04);
    g.fillStyle="#c33";g.beginPath();g.arc(cx,cy,R*.045,0,TAU);g.fill();},
  set:function(M,u,v){var a=(Math.atan2(u,v)*180/PI+360)%360;
    if(M.S.mode==="m")M.S.m=Math.round(a/6)%60;else M.S.h=Math.round((((a-M.S.m*.5)%360)+360)%360/30)%12;
    tone(300+M.S.m*3,.02,"square");M.surf.repaint();},
  down:function(M,u,v){var r=Math.hypot(u,v)/(M.surf.w/2);M.S.mode=r<.5?"h":"m";this.set(M,u,v);},
  move:function(M,u,v){if(M.S.mode)this.set(M,u,v);},
  up:function(M){M.S.mode=null;if(M.S.h===M.S.th&&M.S.m===M.S.tm){sOK();setTimeout(function(){M.done();},450);}}
});

/* ---- 滾輪密碼 ---- */
defMech("wheels",{title:"滾輪密碼鎖",desc:"每個滾輪上下拖曳（或點上半／下半）轉動數字，排出正確密碼即解鎖。",tip:"上下拖曳滾輪，或點滾輪上半／下半轉動數字",
  params:{code:{type:"string",default:"000",desc:"正確數字（字串）"}},
  example:{mech:"wheels",surface:"lock",solved:"flag:open",params:{code:"@answers.code"},ok:["win"]},
  answerOf:function(M){return M.P.code;},
  init:function(M){M.S.vals=Array.from(M.P.code).map(function(){return 0;});M.S.drag=null;},
  geom:function(M){var n=M.S.vals.length,cw=M.surf.w*.78/n;return{n:n,cw:cw,ch:M.surf.h*.5,u:function(i){return(i-(n-1)/2)*cw*1.08;}};},
  draw:function(M,g,w,h){
    var G=this.geom(M),pxu=w/M.surf.w,vals=M.isSolved()?Array.from(M.P.code).map(Number):M.S.vals;
    for(var i=0;i<G.n;i++){
      var cx=w/2+G.u(i)*pxu,cw=G.cw*pxu*.92,ch=G.ch*pxu,cy=h/2;
      g.fillStyle="#0c0e11";g.fillRect(cx-cw/2,cy-ch/2,cw,ch);
      g.strokeStyle="#555b63";g.lineWidth=3;g.strokeRect(cx-cw/2,cy-ch/2,cw,ch);
      g.textAlign="center";g.textBaseline="middle";
      g.font="bold "+Math.round(ch*.5)+"px sans-serif";g.fillStyle="#d9b878";g.fillText(vals[i],cx,cy);
      g.font="bold "+Math.round(ch*.26)+"px sans-serif";g.fillStyle="rgba(217,184,120,.3)";
      g.fillText((vals[i]+9)%10,cx,cy-ch*.34);g.fillText((vals[i]+1)%10,cx,cy+ch*.34);
      g.fillStyle="rgba(217,184,120,.55)";g.font=Math.round(ch*.16)+"px sans-serif";g.fillText("▲",cx,cy-ch*.5-h*.06);g.fillText("▼",cx,cy+ch*.5+h*.06);
    }},
  pick:function(M,u){var G=this.geom(M);for(var i=0;i<G.n;i++)if(Math.abs(u-G.u(i))<=G.cw*.52)return i;return -1;},
  step:function(M,i,d){var v=M.S.vals;v[i]=(v[i]+d+10)%10;tone(380+v[i]*30,.04,"square");M.surf.repaint();
    if(!M.S.fin&&v.join("")===M.P.code){M.S.fin=true;sOK();setTimeout(function(){M.S.fin=false;M.done();},500);}},
  down:function(M,u,v){var i=this.pick(M,u);M.S.drag=i<0?null:{i:i,last:v,acc:0,moved:false,v0:v};},
  move:function(M,u,v){var d=M.S.drag;if(!d)return;d.acc+=v-d.last;d.last=v;var st=M.surf.h*.2;
    while(d.acc>st){this.step(M,d.i,1);d.acc-=st;d.moved=true;}while(d.acc<-st){this.step(M,d.i,-1);d.acc+=st;d.moved=true;}},
  up:function(M,u,v){var d=M.S.drag;M.S.drag=null;if(d&&!d.moved&&Math.abs(v-d.v0)<M.surf.h*.05){this.step(M,d.i,v>0?1:-1);}}
});

/* ---- 按鈕序列 ---- */
defMech("buttons",{title:"按鈕序列",desc:"表面上有一排彩色按鈕，依正確順序按完才算解開。按錯會重來。",tip:"依照線索的順序，依序按下按鈕",
  params:{order:{type:"list",default:["red","blue","green","yellow"],desc:"按鈕由左到右的排列（顏色名）"},sequence:{type:"list",default:["red","blue","green","yellow"],desc:"正確的按下順序"}},
  example:{mech:"buttons",surface:"front",solved:"flag:drawerOpen",params:{order:["green","red","yellow","blue"],sequence:"@answers.seq"},ok:["set:drawerOpen"]},
  answerOf:function(M){return M.P.sequence;},
  init:function(M){M.S.got=[];M.S.lit={};M.S.lock=false;},
  geom:function(M){var n=M.P.order.length,gap=M.surf.w*.04,bw=(M.surf.w*.9-gap*(n-1))/n,bh=M.surf.h*.56;
    return{bw:bw,bh:bh,x:function(i){return-M.surf.w*.45+bw/2+i*(bw+gap);},y:M.surf.h*.1};},
  draw:function(M,g,w,h){
    var G=this.geom(M),pxu=w/M.surf.w,now=Date.now();
    M.P.order.forEach(function(id,i){
      var cx=w/2+G.x(i)*pxu,cy=h/2-G.y*pxu,bw=G.bw*pxu,bh=G.bh*pxu,lit=(M.S.lit[id]||0)>now,r=bh*.18;
      g.fillStyle=lit?"#ffffff":(COLORS[id]||id);g.globalAlpha=lit?1:.92;
      g.beginPath();g.moveTo(cx-bw/2+r,cy-bh/2);g.arcTo(cx+bw/2,cy-bh/2,cx+bw/2,cy+bh/2,r);g.arcTo(cx+bw/2,cy+bh/2,cx-bw/2,cy+bh/2,r);g.arcTo(cx-bw/2,cy+bh/2,cx-bw/2,cy-bh/2,r);g.arcTo(cx-bw/2,cy-bh/2,cx+bw/2,cy-bh/2,r);g.closePath();g.fill();g.globalAlpha=1;
      g.strokeStyle="rgba(0,0,0,.4)";g.lineWidth=3;g.stroke();});
    var n=M.P.sequence.length,dr=h*.045;
    for(var k=0;k<n;k++){var got=M.isSolved()?M.P.sequence[k]:M.S.got[k];g.fillStyle=got?(COLORS[got]||got):"rgba(255,255,255,.12)";g.beginPath();g.arc(w/2+(k-(n-1)/2)*dr*3,h*.86,dr,0,TAU);g.fill();}},
  down:function(M,u,v){
    if(M.S.lock)return;var G=this.geom(M),hit=null;
    M.P.order.forEach(function(id,i){if(Math.abs(u-G.x(i))<=G.bw/2&&Math.abs(v-G.y)<=G.bh/2)hit=id;});
    if(!hit)return;
    M.S.got.push(hit);M.S.lit[hit]=Date.now()+170;tone(260+M.P.order.indexOf(hit)*90,.2,"triangle");M.surf.repaint();setTimeout(function(){M.surf.repaint();},190);
    if(M.S.got.length===M.P.sequence.length){M.S.lock=true;setTimeout(function(){
      if(M.S.got.every(function(x,k){return x===M.P.sequence[k];})){sOK();M.S.lock=false;M.done();}
      else{sBad();M.S.got=[];M.S.lock=false;M.surf.repaint();}},350);}}
});

/* =====================================================================
   表面機關庫 2：手電筒／放大鏡、接線、雷射反射
   同樣介面：init / draw / down|move|up，完成呼叫 M.done()
   可選 check(M)：回傳錯誤字串，供自動驗證檢查機關本身有解
   ===================================================================== */
function glowText(g,txt,x,y,size,color){g.save();g.font="bold "+Math.round(size)+"px "+CJK;g.textAlign="center";g.textBaseline="middle";g.shadowColor=color;g.shadowBlur=size*.5;g.fillStyle=color;g.fillText(txt,x,y);g.restore();}

/* ---- 手電筒／放大鏡：只有照到（或放大）的地方才看得見字 ---- */
defMech("reveal",{title:"手電筒／放大鏡",desc:"手指按住並移動，光圈（或放大鏡）跟著手指，只有圈內看得到隱藏的字。把字整段掃過一遍即完成。通常搭配 if:\"using:道具\"。",
  where:"任何有 surface 的固定物件",tip:"按住並移動手指，用光圈照過整行字",
  params:{text:{type:"string",default:"417",desc:"隱藏的文字"},mode:{type:"string",default:"light",desc:"light＝手電筒（圈外變暗）；lens＝放大鏡（圈外字太小看不清）"},
    at:{type:"vec",default:[0,0],desc:"文字中心 [u,v]（互動面座標）"},size:{type:"number",default:.28,desc:"文字高度（占互動面高度比例）"},radius:{type:"number",default:.2,desc:"光圈半徑（占互動面寬度比例）"},color:{type:"string",default:"#b9a2ff",desc:"發光顏色"}},
  example:{mech:"reveal",surface:"face",if:"using:uvlight",solved:"flag:uvDone",params:{text:"@answers.code.0",mode:"light"},ok:["set:uvDone"]},
  init:function(M){M.S.p=null;M.S.cells={};M.S.box=null;M.S.fin=false;},
  geom:function(M,w,h){var P=M.P,sc=w/M.surf.w;return{cx:w/2+P.at[0]*sc,cy:h/2-P.at[1]*sc,fs:h*P.size,R:P.radius*w,sc:sc};},
  draw:function(M,g,w,h){
    var P=M.P,G=this.geom(M,w,h),solved=M.isSolved();
    g.save();g.font="bold "+Math.round(G.fs)+"px "+CJK;var tw=g.measureText(P.text).width;g.restore();
    M.S.box={x0:G.cx-tw/2,x1:G.cx+tw/2,y0:G.cy-G.fs*.55,y1:G.cy+G.fs*.55};
    if(solved){glowText(g,P.text,G.cx,G.cy,G.fs,P.color);return;}
    var p=M.S.p,px=p?w/2+p[0]*G.sc:0,py=p?h/2-p[1]*G.sc:0;
    if(P.mode==="lens"){
      g.save();g.globalAlpha=.55;g.fillStyle="#888";g.font=Math.round(G.fs*.16)+"px "+CJK;g.textAlign="center";g.textBaseline="middle";g.fillText(P.text.split("").join(" "),G.cx,G.cy);g.restore();
      if(p){g.save();g.beginPath();g.arc(px,py,G.R,0,TAU);g.clip();g.fillStyle="rgba(235,240,230,.92)";g.fillRect(px-G.R,py-G.R,G.R*2,G.R*2);
        g.fillStyle="#223";g.font="bold "+Math.round(G.fs)+"px "+CJK;g.textAlign="center";g.textBaseline="middle";g.fillText(P.text,G.cx,G.cy);g.restore();
        g.strokeStyle="#c9b27a";g.lineWidth=G.R*.12;g.beginPath();g.arc(px,py,G.R,0,TAU);g.stroke();}
    }else{
      var c=M.S.ov;if(!c||c.width!==w){c=M.S.ov=document.createElement("canvas");c.width=w;c.height=h;}
      var o=c.getContext("2d");o.globalCompositeOperation="source-over";o.clearRect(0,0,w,h);o.fillStyle="rgba(4,6,12,.62)";o.fillRect(0,0,w,h);
      if(p){o.globalCompositeOperation="destination-out";var gr=o.createRadialGradient(px,py,G.R*.15,px,py,G.R);gr.addColorStop(0,"rgba(0,0,0,1)");gr.addColorStop(1,"rgba(0,0,0,0)");o.fillStyle=gr;o.beginPath();o.arc(px,py,G.R,0,TAU);o.fill();}
      g.drawImage(c,0,0);
      if(p){g.save();g.beginPath();g.arc(px,py,G.R*.95,0,TAU);g.clip();glowText(g,P.text,G.cx,G.cy,G.fs,P.color);g.restore();}
    }},
  mark:function(M,u,v){var B=M.S.box;if(!B)return;var G=this.geom(M,M.surf.canvas.width,M.surf.canvas.height),px=M.surf.canvas.width/2+u*G.sc,py=M.surf.canvas.height/2-v*G.sc,N=10,i;
    for(i=0;i<N;i++){var x=B.x0+(B.x1-B.x0)*(i+.5)/N;if(Math.hypot(x-px,(B.y0+B.y1)/2-py)<G.R*.9)M.S.cells[i]=1;}
    if(!M.S.fin&&Object.keys(M.S.cells).length>=N){M.S.fin=true;sOK();setTimeout(function(){M.S.p=null;M.S.fin=false;M.done();},500);}},
  down:function(M,u,v){M.S.p=[u,v];this.mark(M,u,v);M.surf.repaint();},
  move:function(M,u,v){if(!M.S.p)return;M.S.p=[u,v];this.mark(M,u,v);M.surf.repaint();},
  up:function(M){M.S.p=null;M.surf.repaint();}
});

/* ---- 接線：把左邊的線頭拖到右邊同色的端子 ---- */
defMech("wires",{title:"接線",desc:"從左邊的線頭拖到右邊同色的端子。全部接對即完成。",tip:"從左邊的線頭拖到右邊同色的端子",
  where:"任何有 surface 的固定物件",
  params:{left:{type:"list",default:["red","blue","green","yellow"],desc:"左側線頭由上到下的顏色"},right:{type:"list",default:["blue","yellow","red","green"],desc:"右側端子由上到下的顏色（要和左側是同一組顏色）"}},
  example:{mech:"wires",surface:"face",if:"flag:panelOpen",solved:"flag:power",params:{left:["red","blue","green"],right:["green","red","blue"]},ok:["set:power"]},
  check:function(M){var a=M.P.left.slice().sort().join(),b=M.P.right.slice().sort().join();return a===b?null:"接線的左右顏色組合不一致";},
  init:function(M){M.S.links={};M.S.drag=null;M.S.fin=false;},
  pos:function(M,side,i){var n=M.P.left.length,h=M.surf.h*.72;return[(side?1:-1)*M.surf.w*.34,h/2-(n<2?h/2:i*h/(n-1))];},
  ok:function(M){var L=M.P.left,R=M.P.right;return L.every(function(c,i){var j=M.S.links[i];return j!=null&&R[j]===c;});},
  draw:function(M,g,w,h){
    var sc=w/M.surf.w,self=this,n=M.P.left.length;
    function px(p){return[w/2+p[0]*sc,h/2-p[1]*sc];}
    function wire(a,b,col){g.strokeStyle="rgba(0,0,0,.5)";g.lineWidth=h*.05;g.lineCap="round";g.beginPath();g.moveTo(a[0],a[1]);g.bezierCurveTo(a[0]+(b[0]-a[0])*.5,a[1],a[0]+(b[0]-a[0])*.5,b[1],b[0],b[1]);g.stroke();
      g.strokeStyle=COLORS[col]||col;g.lineWidth=h*.034;g.beginPath();g.moveTo(a[0],a[1]);g.bezierCurveTo(a[0]+(b[0]-a[0])*.5,a[1],a[0]+(b[0]-a[0])*.5,b[1],b[0],b[1]);g.stroke();}
    var solved=M.isSolved();
    for(var i=0;i<n;i++){var a=px(self.pos(M,0,i)),L=M.P.left[i];
      var j=solved?M.P.right.indexOf(L):M.S.links[i];
      if(j!=null&&j>=0)wire(a,px(self.pos(M,1,j)),L);}
    if(M.S.drag){var d=M.S.drag;wire(px(self.pos(M,0,d.i)),px(d.p),M.P.left[d.i]);}
    for(var k=0;k<n;k++){[0,1].forEach(function(side){var p=px(self.pos(M,side,k)),col=(side?M.P.right:M.P.left)[k];
      g.fillStyle="#2a2d33";g.beginPath();g.arc(p[0],p[1],h*.05,0,TAU);g.fill();g.fillStyle=COLORS[col]||col;g.beginPath();g.arc(p[0],p[1],h*.034,0,TAU);g.fill();});}
  },
  hit:function(M,u,v,side){var n=M.P.left.length;for(var i=0;i<n;i++){var p=this.pos(M,side,i);if(Math.hypot(u-p[0],v-p[1])<M.surf.h*.085)return i;}return -1;},
  down:function(M,u,v){var i=this.hit(M,u,v,0);if(i<0)return;delete M.S.links[i];M.S.drag={i:i,p:[u,v]};tone(300,.04,"square");M.surf.repaint();},
  move:function(M,u,v){if(!M.S.drag)return;M.S.drag.p=[u,v];M.surf.repaint();},
  up:function(M,u,v){var d=M.S.drag;M.S.drag=null;if(!d){return;}
    var j=this.hit(M,u,v,1);
    if(j>=0){for(var k in M.S.links)if(M.S.links[k]===j)delete M.S.links[k];M.S.links[d.i]=j;tone(520,.06,"triangle");}
    M.surf.repaint();
    if(!M.S.fin&&this.ok(M)){M.S.fin=true;sOK();setTimeout(function(){M.S.fin=false;M.done();},500);}}
});

/* ---- 雷射反射：點鏡子切換方向，讓光束打到目標 ---- */
defMech("laser",{title:"雷射反射",desc:"格狀面板上有雷射發射器、可點擊轉向的鏡子、擋牆和目標。點鏡子切換 ／ 與 ＼，讓光束打到目標。",tip:"點鏡子轉向，讓光束打到發亮的目標",
  where:"任何有 surface 的固定物件",
  params:{cols:{type:"number",default:5},rows:{type:"number",default:4},emitter:{type:"number",default:0,desc:"發射器所在列（光束由左邊射入，往右）"},
    target:{type:"vec",default:[4,3],desc:"目標格 [欄,列]"},mirrors:{type:"list",default:[[2,0,"/"],[2,3,"\\"]],desc:"鏡子 [欄,列,初始方向]，方向為 / 或 \\"},walls:{type:"list",default:[],desc:"擋牆格 [欄,列]"}},
  example:{mech:"laser",surface:"face",if:"flag:power",solved:"flag:laserOK",params:{cols:5,rows:4,emitter:0,target:[4,3],mirrors:[[2,0,"\\"],[2,3,"\\"]]},ok:["set:laserOK"]},
  trace:function(P,mir){var d=[1,0],c=-1,r=P.emitter,pts=[[c,r]],hit=false,walls={};P.walls.forEach(function(w){walls[w[0]+","+w[1]]=1;});
    for(var s=0;s<80;s++){c+=d[0];r+=d[1];pts.push([c,r]);
      if(c<0||r<0||c>=P.cols||r>=P.rows)break;if(walls[c+","+r])break;
      if(c===P.target[0]&&r===P.target[1]){hit=true;break;}
      var m=mir[c+","+r];if(m)d=m==="/"?[-d[1],-d[0]]:[d[1],d[0]];}
    return{pts:pts,hit:hit};},
  mirMap:function(M){var o={};M.S.m.forEach(function(m){o[m[0]+","+m[1]]=m[2];});return o;},
  check:function(M){var P=M.P,ms=P.mirrors,n=ms.length,self=this,ok=false,init=false;
    for(var mask=0;mask<(1<<n);mask++){var o={};ms.forEach(function(m,i){o[m[0]+","+m[1]]=(mask>>i&1)?"\\":"/";});
      if(self.trace(P,o).hit){ok=true;var same=ms.every(function(m,i){return o[m[0]+","+m[1]]===m[2];});if(same)init=true;}}
    var o2={};ms.forEach(function(m){o2[m[0]+","+m[1]]=m[2];});
    if(this.trace(P,o2).hit)return "雷射一開始就已經打到目標了，沒有謎題";
    return ok?null:"不管鏡子怎麼轉，雷射都打不到目標（無解）";},
  init:function(M){M.S.m=M.P.mirrors.map(function(m){return[m[0],m[1],m[2]];});M.S.fin=false;},
  cell:function(M){var s=Math.min(M.surf.w*.88/M.P.cols,M.surf.h*.86/M.P.rows);return s;},
  cpos:function(M,c,r){var s=this.cell(M);return[(c-(M.P.cols-1)/2)*s,((M.P.rows-1)/2-r)*s];},
  draw:function(M,g,w,h){
    var P=M.P,sc=w/M.surf.w,s=this.cell(M)*sc,self=this;
    function px(c,r){var p=self.cpos(M,c,r);return[w/2+p[0]*sc,h/2-p[1]*sc];}
    g.fillStyle="#0b1018";g.fillRect(0,0,w,h);

    P.walls.forEach(function(wl){var p=px(wl[0],wl[1]);g.fillStyle="#3a4350";g.fillRect(p[0]-s*.46,p[1]-s*.46,s*.92,s*.92);});
    var mir=this.mirMap(M),T=this.trace(P,mir),solved=M.isSolved()||T.hit;
    var tp=px(P.target[0],P.target[1]);g.save();g.shadowColor=solved?"#6dff9a":"#ff5a5a";g.shadowBlur=s*.4;g.strokeStyle=solved?"#6dff9a":"#ff5a5a";g.lineWidth=s*.08;g.beginPath();g.arc(tp[0],tp[1],s*.28,0,TAU);g.stroke();g.beginPath();g.arc(tp[0],tp[1],s*.1,0,TAU);g.fill();g.restore();

    g.save();g.strokeStyle="#ff3b3b";g.shadowColor="#ff3b3b";g.shadowBlur=s*.3;g.lineWidth=s*.07;g.lineCap="round";g.lineJoin="round";g.beginPath();
    T.pts.forEach(function(q,i){var p=px(q[0],q[1]);if(i===0)g.moveTo(p[0]-s*.2,p[1]);else{var cl=[Math.max(-1,Math.min(P.cols,q[0])),Math.max(-1,Math.min(P.rows,q[1]))];var pp=px(cl[0],cl[1]);g.lineTo(pp[0],pp[1]);}});g.stroke();g.restore();
    M.S.m.forEach(function(m){var p=px(m[0],m[1]),d=s*.36,sl=m[2]==="/"?1:-1;g.strokeStyle="#cfe6ff";g.lineWidth=s*.09;g.lineCap="round";g.beginPath();g.moveTo(p[0]-d,p[1]+sl*d);g.lineTo(p[0]+d,p[1]-sl*d);g.stroke();

/* =====================================================================
   表面機關庫 3：滑塊拼圖、排序
   ===================================================================== */
function tileCol(i,n){return["#d9674a","#4aa3d9","#6fbf5a","#d9b54a","#a56ad9","#d96aa3","#4ad9c0","#9a8a6a","#6a7ad9"][i%9];}
function roundRect(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}

defMech("slide",{title:"滑塊拼圖",desc:"方格裡有一格空位，點與空位相鄰的方塊把它滑過去，把數字排成 1、2、3… 的順序。完成後整張圖會亮起，顯示一行字（例如密碼）。",tip:"點與空位相鄰的方塊，把數字依序排好",
  where:"任何有 surface 的固定物件",
  params:{n:{type:"number",default:3,desc:"邊長（3＝3×3 共 8 塊）"},text:{type:"string",default:"",desc:"完成後顯示的文字"},seed:{type:"number",default:3,desc:"洗牌亂數種子（固定→每次一樣）"}},
  example:{mech:"slide",surface:"face",if:"flag:knobOn",solved:"flag:slideOK",params:{n:3,text:"@answers.code"},ok:["set:slideOK"]},
  check:function(M){var t=this.shuffled(M.P);return t.every(function(v,i){return v===(i+1)%(M.P.n*M.P.n);})?"洗牌後仍是完成狀態，沒有謎題":null;},
  shuffled:function(P){var n=P.n,t=[],i,r=rng(P.seed||3),e;for(i=0;i<n*n;i++)t.push((i+1)%(n*n));e=n*n-1;
    for(var k=0;k<200;k++){var x=e%n,y=(e/n)|0,ds=[];if(x>0)ds.push(e-1);if(x<n-1)ds.push(e+1);if(y>0)ds.push(e-n);if(y<n-1)ds.push(e+n);var j=ds[(r()*ds.length)|0];t[e]=t[j];t[j]=0;e=j;}
    return t;},
  init:function(M){M.S.t=this.shuffled(M.P);M.S.fin=false;},
  geom:function(M){var n=M.P.n,s=Math.min(M.surf.w,M.surf.h)*.88/n;return{n:n,s:s,x:function(i){return((i%n)-(n-1)/2)*s;},y:function(i){return(((n-1)/2)-((i/n)|0))*s;}};},
  draw:function(M,g,w,h){var G=this.geom(M),sc=w/M.surf.w,s=G.s*sc,done=M.isSolved();
    g.fillStyle="#12161c";g.fillRect(0,0,w,h);
    M.S.t.forEach(function(v,i){var cx=w/2+G.x(i)*sc,cy=h/2-G.y(i)*sc;
      if(done&&v===0)v=-1;if(v===0)return;
      g.fillStyle=done?"#2b3a2f":tileCol(v);roundRect(g,cx-s*.47,cy-s*.47,s*.94,s*.94,s*.12);g.fill();
      if(!done){g.fillStyle="rgba(255,255,255,.92)";g.font="bold "+Math.round(s*.5)+"px sans-serif";g.textAlign="center";g.textBaseline="middle";g.fillText(v,cx,cy);}});
    if(done&&M.P.text)glowText(g,M.P.text,w/2,h/2,Math.min(h*.3,w/Math.max(2,M.P.text.length)*.9),"#8cffb0");},
  down:function(M,u,v){if(M.S.fin)return;var G=this.geom(M),n=G.n,t=M.S.t,hit=-1;
    for(var i=0;i<t.length;i++)if(Math.abs(u-G.x(i))<G.s/2&&Math.abs(v-G.y(i))<G.s/2)hit=i;
    if(hit<0||t[hit]===0)return;var e=t.indexOf(0),hx=hit%n,hy=(hit/n)|0,ex=e%n,ey=(e/n)|0;
    if(Math.abs(hx-ex)+Math.abs(hy-ey)!==1){tone(150,.05,"square");return;}
    t[e]=t[hit];t[hit]=0;tone(300+t[e]*30,.04,"square");M.surf.repaint();
    if(t.every(function(x,i){return x===(i+1)%(n*n);})){M.S.fin=true;sOK();setTimeout(function(){M.S.fin=false;M.done();},500);}}
});

defMech("sort",{title:"排序",desc:"一排方塊，點一個再點另一個交換位置，排成指定順序。",tip:"點一塊再點另一塊交換，排成正確順序",

      g.fillStyle=done?"#2f6f4a":tileCol(M.P.target.indexOf(v));roundRect(g,cx-bw/2,cy-bh/2-(sel?bh*.1:0),bw,bh,bw*.12);g.fill();
      if(sel){g.strokeStyle="#fff";g.lineWidth=4;g.stroke();}
      g.fillStyle="rgba(255,255,255,.95)";g.font="bold "+Math.round(bh*.4)+"px "+CJK;g.textAlign="center";g.textBaseline="middle";g.fillText(v,cx,cy-(sel?bh*.1:0));});},
  down:function(M,u,v){if(M.S.fin)return;var G=this.geom(M),hit=-1;
    for(var i=0;i<G.n;i++)if(Math.abs(u-G.x(i))<G.bw/2&&Math.abs(v)<G.bh/2+M.surf.h*.05)hit=i;
    if(hit<0)return;

    else if(M.S.pick===hit){M.S.pick=-1;}
    else{var a=M.S.a,t=a[M.S.pick];a[M.S.pick]=a[hit];a[hit]=t;M.S.pick=-1;tone(520,.05,"square");
      if(a.join("|")===M.P.target.join("|")){M.S.fin=true;sOK();setTimeout(function(){M.S.fin=false;M.done();},500);}}
    M.surf.repaint();}
});

/* =====================================================================
   表面機關庫 4：管線、熄燈、滑桿、記憶序列
   ===================================================================== */
var DIRS={N:1,E:2,S:4,W:8};
function pipeMask(t,r){var base=t==="I"?[5,10]:[3,6,12,9];return base[r%base.length];}

defMech("pipes",{title:"轉管線",desc:"格子裡有直管和彎管，點一格把它轉 90°，讓水從左邊的入口流到右邊的出口。",tip:"點管子轉向，讓水流從左邊接到右邊",
  where:"任何有 surface 的固定物件",
  params:{grid:{type:"list",default:[["L1","I0","L0"],["I0","L2","L3"]],desc:"每列每格：I＝直管、L＝彎管，數字＝起始轉向 0-3，.＝空格"},source:{type:"number",default:0,desc:"入口所在列（左側）"},sink:{type:"number",default:0,desc:"出口所在列（右側）"}},
  example:{mech:"pipes",surface:"face",if:"flag:power",solved:"flag:waterOK",params:{grid:[["L1","I0","L0"],["I0","L2","L3"]],source:0,sink:1},ok:["set:waterOK"]},
  parse:function(P){return P.grid.map(function(row){return row.map(function(c){return c==="."?null:{t:c[0],r:+c.slice(1)||0};});});},
  flow:function(P,g){var R=g.length,C=g[0].length,seen={},q=[[0,P.source]],ok=false;
    function open(c,r,d){var t=g[r]&&g[r][c];return t&&(pipeMask(t.t,t.r)&d);}
    if(!open(0,P.source,DIRS.W))return{seen:seen,ok:false};
    seen["0,"+P.source]=1;
    while(q.length){var p=q.pop(),c=p[0],r=p[1];
      if(c===C-1&&r===P.sink&&open(c,r,DIRS.E))ok=true;
      [[DIRS.N,0,-1,DIRS.S],[DIRS.E,1,0,DIRS.W],[DIRS.S,0,1,DIRS.N],[DIRS.W,-1,0,DIRS.E]].forEach(function(d){
        var nc=c+d[1],nr=r+d[2];if(!open(c,r,d[0]))return;if(nc<0||nr<0||nc>=C||nr>=R)return;if(!open(nc,nr,d[3]))return;
        if(!seen[nc+","+nr]){seen[nc+","+nr]=1;q.push([nc,nr]);}});}
    return{seen:seen,ok:ok};},
  check:function(M){var P=M.P,g=this.parse(P),cells=[];g.forEach(function(row,r){row.forEach(function(t,c){if(t)cells.push(t);});});
    if(cells.length>9)return null;if(this.flow(P,g).ok)return "管線一開始就是通的，沒有謎題";
    var self=this,n=cells.length,tot=Math.pow(4,n),orig=cells.map(function(c){return c.r;});
    for(var m=0;m<tot;m++){var x=m;cells.forEach(function(c,i){c.r=x%4;x=(x/4)|0;});if(self.flow(P,g).ok){cells.forEach(function(c,i){c.r=orig[i];});return null;}}
    cells.forEach(function(c,i){c.r=orig[i];});return "不管怎麼轉，水都接不通（無解）";},
  init:function(M){M.S.g=this.parse(M.P);M.S.fin=false;},
  geom:function(M){var g=M.S.g,R=g.length,C=g[0].length,s=Math.min(M.surf.w*.84/C,M.surf.h*.84/R);return{R:R,C:C,s:s,x:function(c){return(c-(C-1)/2)*s;},y:function(r){return((R-1)/2-r)*s;}};},
  draw:function(M,g,w,h){var G=this.geom(M),sc=w/M.surf.w,s=G.s*sc,F=this.flow(M.P,M.S.g),done=M.isSolved()||F.ok;
    g.fillStyle="#10161d";g.fillRect(0,0,w,h);
    M.S.g.forEach(function(row,r){row.forEach(function(t,c){var cx=w/2+G.x(c)*sc,cy=h/2-G.y(r)*sc;
      g.strokeStyle="rgba(120,160,200,.2)";g.lineWidth=2;g.strokeRect(cx-s/2,cy-s/2,s,s);if(!t)return;
      var wet=done||F.seen[c+","+r],mk=pipeMask(t.t,t.r);g.strokeStyle=wet?"#4fd1ff":"#6b7482";g.lineWidth=s*.22;g.lineCap="round";
      [[1,0,-.5],[2,.5,0],[4,0,.5],[8,-.5,0]].forEach(function(d){if(mk&d[0]){g.beginPath();g.moveTo(cx,cy);g.lineTo(cx+d[1]*s,cy+d[2]*s);g.stroke();}});
      g.fillStyle=wet?"#4fd1ff":"#6b7482";g.beginPath();g.arc(cx,cy,s*.11,0,TAU);g.fill();});});
    var a=[w/2+G.x(0)*sc-s*.5,h/2-G.y(M.P.source)*sc],b=[w/2+G.x(G.C-1)*sc+s*.5,h/2-G.y(M.P.sink)*sc];
    g.fillStyle="#4fd1ff";g.fillRect(a[0]-s*.3,a[1]-s*.1,s*.3,s*.2);g.fillStyle=done?"#4fd1ff":"#6b7482";g.fillRect(b[0],b[1]-s*.1,s*.3,s*.2);},
  down:function(M,u,v){if(M.S.fin)return;var G=this.geom(M),hit=null;
    for(var r=0;r<G.R;r++)for(var c=0;c<G.C;c++)if(Math.abs(u-G.x(c))<G.s/2&&Math.abs(v-G.y(r))<G.s/2)hit=[c,r];
    if(!hit)return;var t=M.S.g[hit[1]][hit[0]];if(!t)return;t.r=(t.r+1)%(t.t==="I"?2:4);tone(330,.04,"square");M.surf.repaint();
    if(this.flow(M.P,M.S.g).ok){M.S.fin=true;sOK();setTimeout(function(){M.S.fin=false;M.done();},700);}}
});

defMech("lights",{title:"熄燈／亮燈",desc:"一排排燈，點一盞會讓它和上下左右的燈一起反轉。把所有燈弄成目標狀態（預設全亮）。",tip:"點燈會連同上下左右一起反轉，讓全部都亮起",
  where:"任何有 surface 的固定物件",
  params:{start:{type:"list",default:["010","111","010"],desc:"每列起始狀態，1＝亮，0＝暗"},target:{type:"list",default:[],desc:"目標狀態（空＝全亮）"}},
  example:{mech:"lights",surface:"face",if:"flag:power",solved:"flag:lampsOK",params:{start:["010","111","010"]},ok:["set:lampsOK"]},
  bits:function(rows){var a=[];rows.forEach(function(r){Array.from(r).forEach(function(ch){a.push(ch==="1"?1:0);});});return a;},
  goal:function(P){var n=this.bits(P.start).length;return P.target&&P.target.length?this.bits(P.target):Array(n).fill(1);},
  check:function(M){var P=M.P,R=P.start.length,C=P.start[0].length,n=R*C,s=this.bits(P.start),t=this.goal(P),i,j;
    if(s.join()===t.join())return "一開始就是目標狀態，沒有謎題";
    var A=[];for(i=0;i<n;i++){A.push(Array(n+1).fill(0));}
    for(var r=0;r<R;r++)for(var c=0;c<C;c++){var k=r*C+c;[[0,0],[1,0],[-1,0],[0,1],[0,-1]].forEach(function(d){var rr=r+d[0],cc=c+d[1];if(rr>=0&&cc>=0&&rr<R&&cc<C)A[rr*C+cc][k]=1;});}
    for(i=0;i<n;i++)A[i][n]=s[i]^t[i];
    var row=0;for(var col=0;col<n&&row<n;col++){var p=-1;for(i=row;i<n;i++)if(A[i][col]){p=i;break;}if(p<0)continue;var tmp=A[row];A[row]=A[p];A[p]=tmp;
      for(i=0;i<n;i++)if(i!==row&&A[i][col])for(j=col;j<=n;j++)A[i][j]^=A[row][j];row++;}
    for(i=row;i<n;i++)if(A[i][n])return "這個盤面不可能解開（無解）";return null;},
  init:function(M){M.S.b=this.bits(M.P.start);M.S.C=M.P.start[0].length;M.S.R=M.P.start.length;M.S.fin=false;},
  geom:function(M){var R=M.S.R,C=M.S.C,s=Math.min(M.surf.w*.84/C,M.surf.h*.84/R);return{R:R,C:C,s:s,x:function(c){return(c-(C-1)/2)*s;},y:function(r){return((R-1)/2-r)*s;}};},
  draw:function(M,g,w,h){var G=this.geom(M),sc=w/M.surf.w,s=G.s*sc,t=this.goal(M.P),done=M.isSolved();
    g.fillStyle="#12161c";g.fillRect(0,0,w,h);
    M.S.b.forEach(function(v,i){var r=(i/G.C)|0,c=i%G.C,cx=w/2+G.x(c)*sc,cy=h/2-G.y(r)*sc,on=done?t[i]:v;
      g.save();if(on){g.shadowColor="#ffd966";g.shadowBlur=s*.3;}g.fillStyle=on?"#ffd966":"#2a313b";g.beginPath();g.arc(cx,cy,s*.38,0,TAU);g.fill();g.restore();
      g.strokeStyle="rgba(255,255,255,.15)";g.lineWidth=3;g.beginPath();g.arc(cx,cy,s*.38,0,TAU);g.stroke();
      if(M.P.target&&M.P.target.length&&!on&&t[i]){g.strokeStyle="#ffd966";g.setLineDash([6,6]);g.beginPath();g.arc(cx,cy,s*.46,0,TAU);g.stroke();g.setLineDash([]);}});},
  down:function(M,u,v){if(M.S.fin)return;var G=this.geom(M),hit=null;
    for(var r=0;r<G.R;r++)for(var c=0;c<G.C;c++)if(Math.hypot(u-G.x(c),v-G.y(r))<G.s*.45)hit=[c,r];
    if(!hit)return;[[0,0],[1,0],[-1,0],[0,1],[0,-1]].forEach(function(d){var c=hit[0]+d[0],r=hit[1]+d[1];if(c>=0&&r>=0&&c<G.C&&r<G.R)M.S.b[r*G.C+c]^=1;});
    tone(380,.05,"square");M.surf.repaint();
    if(M.S.b.join()===this.goal(M.P).join()){M.S.fin=true;sOK();setTimeout(function(){M.S.fin=false;M.done();},600);}}
});

defMech("sliders",{title:"滑桿調節",desc:"幾根直立滑桿，上下拖曳調到指定刻度（例如音量、水位）。每根的目標刻度是答案的一部分，玩家要先從線索得知。",tip:"上下拖曳滑桿，調到線索指示的刻度",
  where:"任何有 surface 的固定物件",
  params:{target:{type:"list",default:[3,1,4],desc:"每根滑桿的目標刻度（建議用 @answers.…）"},start:{type:"list",default:[0,0,0],desc:"起始刻度"},max:{type:"number",default:5,desc:"最大刻度"}},
  example:{mech:"sliders",surface:"face",if:"flag:power",solved:"flag:levelOK",params:{target:"@answers.levels",start:[0,0,0],max:5},ok:["set:levelOK"]},
  answerOf:function(M){return M.P.target;},
  check:function(M){var P=M.P;if(P.target.length!==P.start.length)return "目標與起始的滑桿數量不同";
    if(P.target.some(function(v){return v<0||v>P.max;}))return "目標刻度超出範圍";if(P.target.join()===P.start.join())return "起始就是目標，沒有謎題";return null;},
  init:function(M){M.S.v=M.P.start.slice();M.S.drag=-1;M.S.fin=false;},
  geom:function(M){var n=M.P.target.length,gap=M.surf.w*.9/n;return{n:n,x:function(i){return(i-(n-1)/2)*gap;},top:M.surf.h*.34,bot:-M.surf.h*.34};},
  draw:function(M,g,w,h){var G=this.geom(M),sc=w/M.surf.w,P=M.P,done=M.isSolved();g.fillStyle="#12161c";g.fillRect(0,0,w,h);
    for(var i=0;i<G.n;i++){var x=w/2+G.x(i)*sc,y0=h/2-G.top*sc,y1=h/2-G.bot*sc,v=done?P.target[i]:M.S.v[i],y=y1-(y1-y0)*v/P.max,ok=v===P.target[i]&&M.S.fin;

  setFrom:function(M,i,v){var G=this.geom(M),t=(G.top-v)/(G.top-G.bot);t=1-Math.max(0,Math.min(1,(v-G.bot)/(G.top-G.bot)));

  move:function(M,u,v){if(M.S.drag>=0)this.setFrom(M,M.S.drag,v);},

});

defMech("simon",{title:"記憶序列",desc:"幾個彩色按鈕會依序閃一遍，玩家照樣子按一次。按錯會重新播放。",tip:"先看按鈕閃的順序，再照著按一次",
  where:"任何有 surface 的固定物件",
  params:{pads:{type:"list",default:["red","blue","green","yellow"],desc:"按鈕顏色（由左到右）"},sequence:{type:"list",default:["red","green","blue","yellow","red"],desc:"要記住的順序"}},
  example:{mech:"simon",surface:"face",if:"flag:power",solved:"flag:memOK",params:{pads:["red","blue","green","yellow"],sequence:["red","green","blue"]},ok:["set:memOK"]},
  check:function(M){var P=M.P;return P.sequence.every(function(c){return P.pads.indexOf(c)>=0;})?(P.sequence.length<2?"序列太短":null):"序列用到不存在的按鈕顏色";},
  init:function(M){M.S.mode="idle";M.S.lit=-1;M.S.got=[];M.S.tm=[];},
  geom:function(M){var n=M.P.pads.length,gap=M.surf.w*.03,bw=(M.surf.w*.9-gap*(n-1))/n,bh=Math.min(M.surf.h*.6,bw*1.2);return{n:n,bw:bw,bh:bh,x:function(i){return-M.surf.w*.45+bw/2+i*(bw+gap);}};},
  clear:function(M){M.S.tm.forEach(clearTimeout);M.S.tm=[];},
  play:function(M){var self=this;self.clear(M);M.S.mode="show";M.S.got=[];M.S.lit=-1;M.surf.repaint();var t=500;
    M.P.sequence.forEach(function(c){var i=M.P.pads.indexOf(c);
      M.S.tm.push(setTimeout(function(){M.S.lit=i;tone(260+i*110,.3,"triangle");M.surf.repaint();},t));
      M.S.tm.push(setTimeout(function(){M.S.lit=-1;M.surf.repaint();},t+450));t+=750;});
    M.S.tm.push(setTimeout(function(){M.S.mode="input";M.surf.repaint();},t));},
  draw:function(M,g,w,h){var G=this.geom(M),sc=w/M.surf.w,done=M.isSolved();g.fillStyle="#12161c";g.fillRect(0,0,w,h);
    M.P.pads.forEach(function(id,i){var cx=w/2+G.x(i)*sc,cy=h/2,bw=G.bw*sc,bh=G.bh*sc,lit=M.S.lit===i||done;
      g.save();if(lit){g.shadowColor=COLORS[id]||id;g.shadowBlur=bw*.4;}g.globalAlpha=lit?1:.45;g.fillStyle=COLORS[id]||id;roundRect(g,cx-bw/2,cy-bh/2,bw,bh,bw*.15);g.fill();g.restore();});
    g.fillStyle="rgba(255,255,255,.85)";g.font="bold "+Math.round(h*.07)+"px "+CJK;g.textAlign="center";g.textBaseline="middle";
    g.fillText(done?"完成":M.S.mode==="idle"?"點一下開始播放":M.S.mode==="show"?"請看……":"輪到你（"+M.S.got.length+"/"+M.P.sequence.length+"）",w/2,h*.88);},
  down:function(M,u,v){if(M.S.mode==="show"||M.S.fin)return;

    var G=this.geom(M),hit=-1;for(var i=0;i<G.n;i++)if(Math.abs(u-G.x(i))<G.bw/2&&Math.abs(v)<G.bh/2)hit=i;if(hit<0)return;
    var want=M.P.sequence[M.S.got.length];M.S.lit=hit;tone(260+hit*110,.25,"triangle");M.surf.repaint();setTimeout(function(){M.S.lit=-1;M.surf.repaint();},250);
    if(M.P.pads[hit]!==want){sBad();M.S.mode="idle";M.S.got=[];toast("順序不對，再看一次。");setTimeout(function(){M.surf.repaint();},300);return;}
    M.S.got.push(M.P.pads[hit]);
    if(M.S.got.length===M.P.sequence.length){M.S.fin=true;sOK();setTimeout(function(){M.S.fin=false;M.S.mode="idle";M.done();},600);}
    M.surf.repaint();}
});

/* =====================================================================
   表面機關庫 5：自然科學（滴定、電路、生態金字塔、天氣圖、直線擬合）與排序清單
   共用：按鈕小工具 uiBtn / uiHit，座標轉換 T5
   ===================================================================== */
function T5(M,w,h){var sc=w/M.surf.w;return{sc:sc,X:function(u){return w/2+u*sc;},Y:function(v){return h/2-v*sc;},w:w,h:h};}
function uiBtn(g,T,b){var x=T.X(b.u-b.w/2),y=T.Y(b.v+b.h/2),ww=b.w*T.sc,hh=b.h*T.sc;
  g.fillStyle=b.off?"#262b33":(b.col||"#3d4a5c");roundRect(g,x,y,ww,hh,hh*.22);g.fill();g.strokeStyle=b.off?"rgba(255,255,255,.08)":"rgba(255,255,255,.28)";g.lineWidth=2;g.stroke();
  g.fillStyle=b.off?"#6a7280":"#fff";g.font="bold "+Math.round(hh*(b.fs||.4))+"px "+CJK;g.textAlign="center";g.textBaseline="middle";g.fillText(b.t,x+ww/2,y+hh/2);}
function uiHit(list,u,v){for(var i=0;i<list.length;i++){var b=list[i];if(!b.off&&Math.abs(u-b.u)<=b.w/2&&Math.abs(v-b.v)<=b.h/2)return b;}return null;}
function uiText(g,T,t,u,v,fs,col,al){g.fillStyle=col||"#e8eef5";g.font=Math.round(fs*T.h)+"px "+CJK;g.textAlign=al||"center";g.textBaseline="middle";g.fillText(t,T.X(u),T.Y(v));}
function finish(M,ms){M.S.fin=true;sOK();setTimeout(function(){M.S.fin=false;M.done();},ms||700);}

defMech("titrate",{title:"滴定",desc:"用滴定管把已知濃度的鹼液滴進酸液，直到指示劑剛好出現淡淡的粉紅色（終點）再記錄體積。先大量、再小量、最後一滴一滴，過量了就重新裝填。體積可以拿來算出酸的濃度。",
  tip:"先大步滴，接近時改小步；剛出現淡粉紅就按「記錄終點」",where:"任何有 surface 的固定物件",
  params:{acidMl:{type:"number",default:20,desc:"錐形瓶裡酸液的體積（mL）"},acidM:{type:"number",default:.12,desc:"酸液真正的濃度 M（玩家要算出來，不會顯示）"},baseM:{type:"number",default:.1,desc:"滴定管鹼液濃度 M（會顯示）"},needFlag:{type:"flag",default:"",desc:"加入指示劑後成立的旗標；空白＝一開始就有指示劑"}},
  example:{mech:"titrate",surface:"face",solved:"flag:titrated",params:{acidMl:20,acidM:.12,baseM:.1},ok:["set:titrated"]},
  veq:function(P){return P.acidM*P.acidMl/P.baseM;},
  check:function(M){var v=this.veq(M.P);if(v<3||v>45)return "終點體積要在 3～45 mL 之間（滴定管容量 50 mL）";if(Math.abs(v*50-Math.round(v*50))>1e-6)return "終點體積必須是 0.02 mL 的倍數，否則最小滴量無法剛好越過終點";return null;},
  init:function(M){M.S.V=0;M.S.msg="";M.S.fin=false;},
  ind:function(M){return !M.P.needFlag||cond("flag:"+M.P.needFlag);},
  btns:function(M){var s=M.S.fin||M.isSolved();return[{t:"+1.00 mL",u:-.62,v:-.44,w:.5,h:.2,k:1,off:s},{t:"+0.10 mL",u:-.06,v:-.44,w:.5,h:.2,k:.1,off:s},{t:"+0.02 mL",u:.5,v:-.44,w:.5,h:.2,k:.02,off:s},{t:"重新裝填",u:-.5,v:-.66,w:.7,h:.2,k:"reset",col:"#5a4a3a",off:s},{t:"記錄終點",u:.42,v:-.66,w:.8,h:.2,k:"rec",col:"#2f6f4a",off:s}];},
  draw:function(M,g,w,h){var T=T5(M,w,h),P=M.P,V=M.isSolved()?this.veq(P)+.02:M.S.V,ve=this.veq(P),ex=Math.max(0,V-ve),a=this.ind(M)?1-Math.exp(-ex/.06):0,u0=-M.surf.w*.5;
    g.fillStyle="#141a22";g.fillRect(0,0,w,h);
    // 滴定管
    var bx=T.X(-.78),by0=T.Y(.58),by1=T.Y(-.12),bw=T.sc*.16;g.fillStyle="rgba(190,225,255,.15)";g.fillRect(bx-bw/2,by0,bw,by1-by0);
    var fr=Math.max(0,1-V/50);g.fillStyle="rgba(120,190,255,.7)";g.fillRect(bx-bw/2+2,by0+(by1-by0)*(1-fr),bw-4,(by1-by0)*fr);
    g.strokeStyle="rgba(255,255,255,.5)";g.lineWidth=2;g.strokeRect(bx-bw/2,by0,bw,by1-by0);
    for(var i=0;i<=10;i++){var y=by0+(by1-by0)*i/10;g.beginPath();g.moveTo(bx+bw/2,y);g.lineTo(bx+bw/2+(i%5?6:12),y);g.stroke();}
    g.fillStyle="#9ab";g.font=Math.round(h*.05)+"px "+CJK;g.textAlign="left";g.fillText("0",bx+bw/2+16,by0+6);g.fillText("50",bx+bw/2+16,by1-6);
    g.fillStyle="#cfe3ff";g.fillRect(bx-3,by1,6,T.sc*.1);
    if(!M.S.fin&&!M.isSolved()&&M.S.drip){g.fillStyle="rgba(150,210,255,.9)";g.beginPath();g.arc(bx,by1+T.sc*.16,5,0,TAU);g.fill();}
    // 錐形瓶
    var fx=T.X(-.12),fy=T.Y(-.2),fw=T.sc*.7,fh=T.sc*.7;g.beginPath();g.moveTo(fx-fw*.14,fy-fh);g.lineTo(fx+fw*.14,fy-fh);g.lineTo(fx+fw*.5,fy);g.lineTo(fx-fw*.5,fy);g.closePath();
    g.fillStyle="rgba(200,225,240,.12)";g.fill();
    g.save();g.clip();var lv=fy-fh*.45;g.fillStyle=a>0?"rgba(235,60,150,"+(.25+a*.7).toFixed(2)+")":"rgba(180,215,240,.45)";g.fillRect(fx-fw,lv,fw*2,fh);g.restore();
    g.strokeStyle="rgba(255,255,255,.6)";g.lineWidth=3;g.beginPath();g.moveTo(fx-fw*.14,fy-fh);g.lineTo(fx+fw*.14,fy-fh);g.lineTo(fx+fw*.5,fy);g.lineTo(fx-fw*.5,fy);g.closePath();g.stroke();
    uiText(g,T,this.ind(M)?"錐形瓶：酸液 "+P.acidMl.toFixed(1)+" mL＋酚酞":"錐形瓶：酸液 "+P.acidMl.toFixed(1)+" mL（還沒加指示劑）",-.12,.72,.05,"#bcd");
    uiText(g,T,P.baseM.toFixed(3)+" M",-.78,-.2,.045,"#9fc3ea");
    uiText(g,T,"讀數 "+V.toFixed(2)+" mL",.62,.45,.08,"#fff");
    var done=M.isSolved();uiText(g,T,done?"已記錄終點":M.S.msg,.62,.12,.05,done?"#7dffb0":"#ffd27a");
    if(!done)this.btns(M).forEach(function(b){uiBtn(g,T,b);});},
  down:function(M,u,v){if(M.S.fin||M.isSolved())return;var b=uiHit(this.btns(M),u,v);if(!b)return;var P=M.P,ve=this.veq(P);
    if(b.k==="reset"){M.S.V=0;M.S.msg="已重新裝填，從頭再來。";tone(300,.06,"triangle");}
    else if(b.k==="rec"){var ex=M.S.V-ve;
      if(!this.ind(M)){M.S.msg="看不出顏色變化，需要先加入指示劑。";sBad();}
      else if(ex<=1e-9){M.S.msg="溶液還是無色，終點還沒到。";sBad();}
      else if(ex<=.065){M.S.fin=true;M.S.msg="";M.surf.repaint();sOK();setTimeout(function(){M.S.fin=false;M.S.V=ve+.02;M.done();},500);}
      else{M.S.msg="太紅了，過量了！請重新裝填。";sBad();}}
    else{if(M.S.V+b.k>50.0001){M.S.msg="滴定管沒液體了，請重新裝填。";sBad();}else{M.S.V=Math.round((M.S.V+b.k)*100)/100;tone(500+M.S.V*6,.04,"sine");M.S.drip=true;setTimeout(function(){M.S.drip=false;M.surf.repaint();},180);
      M.S.msg=this.ind(M)&&M.S.V-ve>.2?"過量了！溶液紅得很深，請重新裝填。":"";}}
    M.surf.repaint();}
});

defMech("circuit",{title:"串並聯電路",desc:"三顆燈泡、一個電池。用兩個開關決定 A、B 要串聯還是並聯，以及 C 要不要接、接成串聯還是並聯。每顆燈泡有額定電壓，太亮會燒壞，太暗不算亮。要讓三顆都正常發亮。畫面上會顯示總電流與各燈泡的電壓。",
  tip:"切換接法，看電壓與亮度；三顆都剛好正常亮就成功",where:"任何有 surface 的固定物件",
  params:{V:{type:"number",default:6,desc:"電池電壓（V）"},bulbs:{type:"list",default:[{n:"A",R:8,Vr:3},{n:"B",R:8,Vr:3},{n:"C",R:4,Vr:3}],desc:"三顆燈泡：名稱、電阻（Ω）、額定電壓（V）"},lo:{type:"number",default:.75,desc:"亮度下限（相對額定）"},hi:{type:"number",default:1.3,desc:"亮度上限，超過 1.6 會燒壞"}},
  example:{mech:"circuit",surface:"face",solved:"flag:circuitOK",params:{V:9},ok:["set:circuitOK"]},
  solve:function(P,ab,c){var b=P.bulbs,Ra=b[0].R,Rb=b[1].R,Rc=b[2].R,V=P.V,Rab=ab?Ra+Rb:Ra*Rb/(Ra+Rb),Vab,Vc,Rt;
    if(c===0){Vab=V;Vc=0;Rt=Rab;}else if(c===1){Vab=V;Vc=V;Rt=1/(1/Rab+1/Rc);}else{Rt=Rab+Rc;Vab=V*Rab/Rt;Vc=V*Rc/Rt;}
    var Va=ab?Vab*Ra/(Ra+Rb):Vab,Vb=ab?Vab*Rb/(Ra+Rb):Vab,v=[Va,Vb,Vc];

  verdict:function(P,r){var burn=r.br.some(function(x){return x>1.6;}),ok=r.br.every(function(x){return x>=P.lo&&x<=P.hi;});return{burn:burn,ok:ok};},
  check:function(M){var P=M.P,n=0,self=this;for(var ab=0;ab<2;ab++)for(var c=0;c<3;c++){var r=self.solve(P,ab,c);if(self.verdict(P,r).ok)n++;}
    if(P.bulbs.length!==3)return "需要剛好三顆燈泡";if(n===0)return "沒有任何接法能讓三顆燈泡都正常亮（無解）";if(n>1)return "有多種接法都能過關（"+n+" 種），謎題不唯一";
    if(self.verdict(P,self.solve(P,0,0)).ok)return "預設接法就是答案";return null;},
  init:function(M){M.S.ab=0;M.S.c=0;M.S.fin=false;M.S.msg="";},
  btns:function(M){var s=M.S.fin||M.isSolved();return[{t:M.S.ab?"A、B：串聯":"A、B：並聯",u:-.5,v:-.66,w:.9,h:.2,k:"ab",off:s},{t:["C：不接","C：並聯","C：串聯"][M.S.c],u:.5,v:-.66,w:.9,h:.2,k:"c",off:s}];},
  tree:function(ab,c){var A={t:"b",i:0},B={t:"b",i:1},C={t:"b",i:2},g={t:ab?"s":"p",k:[A,B]};return c===0?g:c===1?{t:"p",k:[g,C]}:{t:"s",k:[g,C]};},
  size:function(n){if(n.t==="b")return[1,1];var s=n.k.map(this.size.bind(this));return n.t==="s"?[s.reduce(function(a,x){return a+x[0];},0),Math.max.apply(null,s.map(function(x){return x[1];}))]:[Math.max.apply(null,s.map(function(x){return x[0];})),s.reduce(function(a,x){return a+x[1];},0)];},
  drawNode:function(g,n,x,y,w,h,br,u){var self=this;
    if(n.t==="b"){var cx=x+w/2,cy=y+h/2,r=Math.min(w,h)*.3,b=br[n.i],lit=Math.min(1.6,b);
      g.strokeStyle="#9aa6b5";g.lineWidth=3;g.beginPath();g.moveTo(x,cy);g.lineTo(cx-r,cy);g.moveTo(cx+r,cy);g.lineTo(x+w,cy);g.stroke();

      g.strokeStyle="#cfd6de";g.lineWidth=2;g.beginPath();g.arc(cx,cy,r,0,TAU);g.stroke();
      g.fillStyle="#fff";g.font="bold "+Math.round(r*.9)+"px "+CJK;g.textAlign="center";g.textBaseline="middle";g.fillText("ABC"[n.i],cx,cy);return;}
    var s=n.k.map(function(k){return self.size(k);});
    if(n.t==="s"){var tw=s.reduce(function(a,q){return a+q[0];},0),cx=x;n.k.forEach(function(k,i){var ww=w*s[i][0]/tw;self.drawNode(g,k,cx,y,ww,h,br,u);cx+=ww;});}
    else{var th=s.reduce(function(a,q){return a+q[1];},0),cy=y;g.strokeStyle="#9aa6b5";g.lineWidth=3;
      n.k.forEach(function(k,i){var hh=h*s[i][1]/th;self.drawNode(g,k,x+w*.08,cy,w*.84,hh,br,u);g.beginPath();g.moveTo(x,cy+hh/2);g.lineTo(x+w*.08,cy+hh/2);g.moveTo(x+w*.92,cy+hh/2);g.lineTo(x+w,cy+hh/2);g.stroke();cy+=hh;});
      var y0=y+h*s[0][1]/th/2,y1=y+h-h*s[s.length-1][1]/th/2;g.beginPath();g.moveTo(x,y0);g.lineTo(x,y1);g.moveTo(x+w,y0);g.lineTo(x+w,y1);g.stroke();}},
  draw:function(M,g,w,h){var T=T5(M,w,h),P=M.P,done=M.isSolved(),ab=done?this.sol(M)[0]:M.S.ab,c=done?this.sol(M)[1]:M.S.c,r=this.solve(P,ab,c);

  draw:function(M,g,w,h){var self=this,T=T5(M,w,h),P=M.P,B=this.boxes(M),done=M.isSolved(),a=M.S.in,o=this.out(P,done?this.sol(M)[0]:M.S.g1,done?this.sol(M)[1]:M.S.g2,a[0],a[1],a[2]);g.fillStyle="#12161c";g.fillRect(0,0,w,h);

/* ---------- 凱撒密碼盤 ---------- */
defMech("caesar",{title:"凱撒密碼盤",desc:"一串英文大寫的密文，每個字母都往後移了固定的位數。轉動密碼盤（◀ ▶）調整位移，畫面會即時顯示解出來的字。找到通順的英文句子後按「確認原文」。",

  draw:function(M,g,w,h){var T=T5(M,w,h),P=M.P,done=M.isSolved(),k=done?P.shift:M.S.k;g.fillStyle="#12161c";g.fillRect(0,0,w,h);
    uiText(g,T,"密文",0,.62,.045,"#9fb0c4");var fs=Math.round(h*.075);g.font="bold "+fs+"px monospace";while(g.measureText(P.cipher).width>w*.92&&fs>10){fs--;g.font="bold "+fs+"px monospace";}
    g.fillStyle="#7ad0ff";g.textAlign="center";g.textBaseline="middle";g.fillText(P.cipher,T.X(0),T.Y(.5));
    uiText(g,T,"位移 "+k,0,-.15,.1,"#ffd966");
    uiText(g,T,"解出來：",0,.22,.045,"#9fb0c4");g.font="bold "+fs+"px monospace";g.fillStyle=done?"#8dffb8":"#ffffff";g.fillText(this.dec(P.cipher,k),T.X(0),T.Y(.1));
    uiText(g,T,done?"解開了。":M.S.msg,0,-.36,.045,done?"#8dffb8":"#ffb27a");
    if(!done)this.btns(M).forEach(function(b){uiBtn(g,T,b);});},

    else{M.S.k=(M.S.k+b.k+26)%26;M.S.msg="";tone(300+M.S.k*15,.04,"square");}M.surf.repaint();}

      g.fillStyle=dk?"#3a3426":"#e8eef5";g.font=Math.round(h*.045)+"px "+CJK;g.textAlign="center";g.textBaseline="middle";g.fillText(nm[i],x,y1+h*.08);g.fillText(String(val),x,y0-h*.06);}

defMech("rhythmtap",{title:"按壓節奏",desc:"一個大圓盤，要連續按指定次數，而且節奏要穩：相鄰兩次的間隔必須在範圍內（預設每分鐘 100～120 下）。太快、太慢或停頓就重新計數。畫面會顯示目前節奏。",
  tip:"連續穩定地點圓盤，節奏要在每分鐘 100～120 下",where:"任何有 surface 的固定物件",
  params:{count:{type:"number",default:30,desc:"需要連續按幾下"},bpmMin:{type:"number",default:100},bpmMax:{type:"number",default:120},beat:{type:"bool",default:false,desc:"是否在畫面邊緣閃示拍點當提示"}},

defMech("gears",{title:"齒輪組",desc:"輸入齒輪 A 帶動 B，B 和 C 裝在同一根軸上一起轉，C 再帶動輸出齒輪 D。按下方 B、C、D 三個按鈕輪流換齒數。畫面顯示輸出轉速，調到目標轉速才能啟動機構。",

  turn:function(k){view.az=vgoal.az=IZ_AZ-k*PI/2;view.el=vgoal.el=IZ_EL;need=true;return new Promise(function(r){requestAnimationFrame(function(){requestAnimationFrame(r);});});},
  focus:function(oid){enterFocus(oid);return new Promise(function(r){setTimeout(r,1300);});},
  unfocus:function(){exitFocus();return new Promise(function(r){setTimeout(r,1200);});},
  probe:function(hot){
    var cam=lastCam,found=null,tries=0;
    (function w(n,M,h){
      if(found||!n.visible||n.hid)return;var m=mMul(M,n.local()),hh=n.hot||h;
      if(hh===hot){n.parts.forEach(function(p){
        for(var i=0;i<p.faces.length&&i<8&&!found;i++){var f=p.faces[i],c=[0,0,0],np=f.np;
          for(var k=0;k<np;k++){var q=mAp(m,f.v[k]);c[0]+=q[0]/np;c[1]+=q[1]/np;c[2]+=q[2]/np;}
          var s=mAp(cam.C,c),x=cam.ox+cam.s*(s[0]-cam.cx),y=cam.oy-cam.s*(s[1]-cam.cy);
          if(x<0||y<0||x>W||y>H)continue;tries++;
          if(render(gx,SC.root,Object.assign({},cam,{pick:{x:x,y:y}}))===hot)found=[x,y];}});}
      n.kids.forEach(function(k){w(k,m,hh);});})(SC.root,mI(),null);
    return found;},
  objects:function(){return Object.keys(SC.obj).map(function(k){var o=SC.obj[k];return{id:k,mode:o.focus.mode||"iso",surfaces:Object.keys(o.surfs),wall:o.wall};});},
  scenes:function(){return Object.keys(LV.scenes);},
  campaign:function(){return{isLocked:function(id){return isLocked(LEVELS.find(function(l){return l.id===id;}));},isDone:isDone,frag:fragCount,win:winLevel};},levelIds:function(){return LEVELS.map(function(l){return l.id;});},
  surfHot:function(oid,name){var s=SC.obj[oid].surfs[name];return s.node.hot;},
  solve:solve,validate:validate,
  catalog:catalog,
  hots:function(){return Object.keys(SC.hotOwner);},
  mechs:function(){return SC.mechs.map(function(M){return{id:M.id,active:M.active(),surf:M.surf.id};});},
  surfXY:function(oid,name,u,v){var s=SC.obj[oid].surfs[name],cam=lastCam,M=worldMat(s.node),q=mAp(cam.C,mAp(M,[u,v,0]));return[cam.ox+cam.s*(q[0]-cam.cx),cam.oy-cam.s*(q[1]-cam.cy)];},
  mech:function(id){return SC.mechs.find(function(M){return M.id===id;});},
  mechGeom:function(id){var M=SC.mechs.find(function(m){return m.id===id;});return M.def.geom(M);}
};
var lm=location.search.match(/level=(\w+)/);
if(lm){var want=lm[1],lv=LEVELS.find(function(l){return l.id===want||l.id==="L"+want;});loadLevel(lv||LEVELS[0]);}
else if(!window.__EMBED){loadLevel(LEVELS[0],{silent:true});menu();}
/* 內嵌預覽：由外層頁面（設計者平台）用 postMessage 傳入關卡規格 */
window.addEventListener("message",function(e){
  var d=e.data;if(!d||typeof d!=="object")return;
  try{
    if(d.roomPreview){var spec=d.roomPreview;closeModal();loadLevel(spec,{silent:true,preview:true});
      $("app").classList.add("embed");parent.postMessage({roomEvent:"loaded",scenes:Object.keys(spec.scenes)},"*");}
    else if(d.roomCheck){var sp=d.roomCheck;closeModal();loadLevel(sp,{silent:true,preview:true});
      var vr=JSON.parse(JSON.stringify(validate()));loadLevel(sp,{silent:true,preview:true});$("app").classList.add("embed");
      parent.postMessage({roomEvent:"checked",result:vr},"*");}
    else if(d.roomScene&&LV&&LV.scenes[d.roomScene]){enterScene(d.roomScene);}
  }catch(err){parent.postMessage({roomEvent:"error",message:String(err&&err.message||err)},"*");}
});
try{if(window.parent!==window)parent.postMessage({roomEvent:"ready"},"*");}catch(x){}
frame();

})();
</script>
