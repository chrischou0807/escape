<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>建造挑戰</title>
<style>
:root{--bg:#14110f;--card:#1f1a16;--ink:#f1e8d8;--dim:#a99c86;--brass:#d9b878;--ok:#7fc79a;--bad:#e07b6a;--line:#3a3128}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,"Noto Sans TC",sans-serif;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#app{max-width:760px;margin:0 auto;padding:18px 16px 60px}h1{font-size:21px;margin:6px 0 2px;color:var(--brass)}.sub{color:var(--dim);font-size:14px;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
button,input,select,textarea{font:inherit;color:var(--ink)}button{background:#2c241d;border:1px solid var(--brass);border-radius:10px;padding:8px 16px;cursor:pointer}button:active{transform:scale(.97)}
button.g{border-color:var(--line);color:var(--dim)}input[type=text],textarea{background:#120f0c;border:1px solid var(--line);border-radius:10px;padding:8px 12px;width:100%;-webkit-user-select:text;user-select:text}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.msg{min-height:24px;color:var(--dim);margin-top:8px}.msg.bad{color:var(--bad)}.msg.ok{color:var(--ok)}
#win{position:fixed;inset:0;background:rgba(10,8,6,.88);display:none;align-items:center;justify-content:center;padding:20px;z-index:9}
#win .box{background:var(--card);border:1px solid var(--brass);border-radius:16px;padding:22px;max-width:460px;text-align:center}#win h2{margin:0 0 8px;color:var(--brass)}
#hintb{margin-top:18px}.tip{color:var(--dim);font-size:13px;margin-top:6px}
.bd{display:grid;gap:3px;margin:8px 0}.bd div{aspect-ratio:1;border:1px dashed var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:26px;cursor:pointer}.bd div.g{border-style:solid}.bl{display:flex;gap:8px}.bl button.on{background:#4a3a28}
</style></head><body><div id="app"><h1 id="ttl"></h1><p class="sub" id="intro"></p><div id="stage"></div>
<div class="row" id="hintb"><button class="g" id="hintBtn">💡 提示</button><button class="g" id="again">↺ 重來</button></div><div class="tip" id="hintTxt"></div></div>
<div id="win"><div class="box"><h2>🎉 成功</h2><div id="revealTxt"></div><p><button onclick="location.reload()">再玩一次</button></p></div></div>
<script>
// ===== 老師改這裡 CONFIG =====
const CFG={"title": "建造挑戰", "intro": "用積木蓋出符合條件的結構。點格子放上選中的積木，再點一次拆掉。積木不能懸空。", "cols": 6, "rows": 6, "budget": 14, "minHeight": 4, "mustHave": "🔺", "blocks": [{"e": "🟫", "c": 1, "n": "磚塊"}, {"e": "🔺", "c": 2, "n": "屋頂"}], "reveal": "結構通過驗收！\\n你在預算內蓋出夠高、且有屋頂的建築。", "hint": "底層要先鋪滿，再往上疊。屋頂放最上面。"};
// ===== 以下是機關程式 =====
const $=id=>document.getElementById(id);const rnd=n=>Math.floor(Math.random()*n);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const norm=s=>String(s||"").replace(/\s+/g,"").toLowerCase();
function say(t,c){const m=$("msg");if(m){m.textContent=t;m.className="msg "+(c||"")}}
function win(){$("revealTxt").innerHTML=(CFG.reveal||"").replace(/\n/g,"<br>");$("win").style.display="flex"}
$("ttl").textContent=CFG.title;$("intro").textContent=CFG.intro;
$("hintBtn").onclick=()=>{$("hintTxt").textContent=CFG.hint||"（沒有提示）"};$("again").onclick=()=>location.reload();
$("stage").innerHTML='<div class="card" id="rq"></div><div class="bl" id="bl"></div><div class="bd" id="bd"></div><div class="row"><button id="ck">驗收</button></div><div class="msg" id="msg"></div>';
const g=[];for(let r=0;r<CFG.rows;r++){g.push(Array(CFG.cols).fill(null))}let cur=0;
$("bd").style.gridTemplateColumns="repeat("+CFG.cols+",1fr)";
function cost(){let c=0;g.forEach(r=>r.forEach(x=>{if(x!==null)c+=CFG.blocks[x].c}));return c}
function height(){for(let r=0;r<CFG.rows;r++)if(g[r].some(x=>x!==null))return CFG.rows-r;return 0}
function pd(){$("rq").innerHTML="需求：高度 ≥ <b>"+CFG.minHeight+"</b>、需要包含 <b>"+CFG.mustHave+"</b>、總花費 ≤ <b>"+CFG.budget+"</b>　（目前花費 "+cost()+"，高度 "+height()+"）";
 $("bl").innerHTML="";CFG.blocks.forEach((b,i)=>{const x=document.createElement("button");x.className=i===cur?"on":"";x.textContent=b.e+" "+b.n+"（"+b.c+"）";x.onclick=()=>{cur=i;pd()};$("bl").appendChild(x)});
 $("bd").innerHTML="";g.forEach((row,r)=>row.forEach((v,c)=>{const d=document.createElement("div");d.className=v!==null?"g":"";d.textContent=v!==null?CFG.blocks[v].e:"";d.onclick=()=>{if(v!==null){g[r][c]=null}else{g[r][c]=cur}pd()};$("bd").appendChild(d)}))}
$("ck").onclick=()=>{let float=false;g.forEach((row,r)=>row.forEach((v,c)=>{if(v!==null&&r<CFG.rows-1&&g[r+1][c]===null)float=true}));
 const has=g.some(r=>r.some(x=>x!==null&&CFG.blocks[x].e===CFG.mustHave));const errs=[];if(float)errs.push("有積木懸空");if(height()<CFG.minHeight)errs.push("高度不夠");if(!has)errs.push("缺少 "+CFG.mustHave);if(cost()>CFG.budget)errs.push("超出預算");
 if(!errs.length){say("通過","ok");setTimeout(win,500)}else say("未通過："+errs.join("、"),"bad")};pd();
</script></body></html>
