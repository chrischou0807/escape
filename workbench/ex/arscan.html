<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AR 圖像顯影</title>
<style>
:root{--bg:#14110f;--card:#1f1a16;--line:#3a3128;--ink:#f1e8d8;--dim:#b8ab97;--brass:#d9b878;--ok:#7fc79a;--bad:#e07b6a}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:12px 20px;cursor:pointer;background:var(--brass);color:#2b2010;font-size:16px}
button.g{background:#ffffff1f;color:var(--ink)}
input{font:inherit;font-size:18px;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:#0e0c0a;color:var(--ink);width:100%}
#intro,#done{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto}
.card{max-width:540px;width:100%;line-height:1.75}
.eyebrow{color:var(--brass);font-size:14px;letter-spacing:.08em}
h1{font-size:26px;margin:4px 0 8px}
.dim{color:var(--dim)}
ol{padding-left:22px;color:var(--dim)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
#ar{position:fixed;inset:0;overflow:hidden}
#ar video{object-fit:cover}
.bar{position:fixed;left:0;right:0;z-index:10;padding:14px 16px;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center}
#top{top:0;padding-top:calc(14px + env(safe-area-inset-top));background:linear-gradient(#000b,#0000)}
#bottom{bottom:0;padding-bottom:calc(14px + env(safe-area-inset-bottom));background:linear-gradient(#0000,#000d)}
#status{font-size:15px;max-width:520px}
#status.found{color:var(--brass);font-weight:700}
#ans{display:flex;gap:8px;width:100%;max-width:460px}
#ans input{flex:1}
#msg{min-height:22px;font-size:15px}
#msg.bad{color:var(--bad)}#msg.ok{color:var(--ok)}
.shake{animation:shk .4s}@keyframes shk{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
#fb,#show{position:fixed;inset:0;z-index:30;background:#000e;display:none;overflow:auto;padding:18px}
#fb .box{max-width:560px;margin:0 auto}
.stage{position:relative}
.stage img{width:100%;display:block;border-radius:8px}
.stage canvas{position:absolute;opacity:0;transition:opacity 1.6s}
#fb.on .stage canvas{opacity:1}
#show{background:#fff;padding:0;display:none;align-items:center;justify-content:center}
#show img{max-width:100%;max-height:100vh}
#show button{position:fixed;top:12px;right:12px}
#tpanel{display:none;margin-top:18px;border:1px dashed var(--line);border-radius:14px;padding:14px}
#tpanel a{color:var(--brass)}
</style>
<script type="importmap">
{"imports":{
 "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
 "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/",
 "mindar-image-three":"https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
}}
</script>
</head>
<body>
<div id="intro"><div class="card">
<div class="eyebrow" id="i_eb"></div>
<h1 id="i_title"></h1>
<p class="dim" id="i_story"></p>
<ol>
<li>把辨識圖顯示在<b>另一個螢幕</b>上，或印出來。</li>
<li>用手機按「開啟魔法鏡頭」，允許使用相機。</li>
<li>讓整張圖都進入鏡頭，找出隱藏的訊息，輸入答案。</li>
</ol>
<p class="dim" style="font-size:13px">第一次開啟時，手機要先「學會」這張圖，大約需要半分鐘；同一支手機之後會記住。</p>
<div class="row"><button id="start">開啟魔法鏡頭</button><button class="g" id="showBtn">顯示辨識圖</button></div>
<div id="tpanel">
<b>老師工具</b>
<p class="dim" style="font-size:14px;margin:6px 0">換成自己的圖：選一張圖片，手機或電腦會先學會它，學完可以下載辨識檔（.mind），和這個網頁放在同一個資料夾，並在 CONFIG 填上檔名，玩家就不用等。</p>
<input type="file" id="tFile" accept="image/*">
<p id="tMsg" class="dim" style="font-size:14px"></p>
</div>
</div></div>

<div id="ar"></div>
<div class="bar" id="top"><div id="status">準備中……</div></div>
<div class="bar" id="bottom">
<div id="ans"><input id="aIn" placeholder="輸入你看見的答案" autocomplete="off"><button id="aGo">送出</button></div>
<div id="msg"></div>
<button class="g" id="help">看不到嗎？</button>
</div>

<div id="fb"><div class="box">
<p id="fbMsg" style="line-height:1.7"></p>
<div class="stage" id="fbStage"></div>
<p style="text-align:center;margin-top:14px"><button id="fbClose">關閉</button></p>
</div></div>
<div id="show"><img id="showImg" alt="辨識圖"><button class="g" style="background:#0008;color:#fff" id="showClose">關閉</button></div>

<div id="done"style="display:none"><div class="card" style="text-align:center">
<div style="font-size:54px">🗝️</div>
<h1 id="d_title"></h1>
<p class="dim" id="d_text"></p>
<div class="row" style="justify-content:center"><button id="again">再玩一次</button></div>
</div></div>

<script type="module">
/* ====== 老師只要改這裡 ====== */
const CONFIG={
  eyebrow:"AR 圖像顯影",
  title:"探險隊的藏寶圖",
  story:"船長留下一張藏寶圖，說真正的寶藏不在地圖上。也許，要用魔法鏡頭看，才看得到她留下的密碼。",
  target:"arscan_target.jpg",            // 要辨識的圖（可以換成同資料夾的檔名，例如 "letter.png"）
  ratio:1414/1000,                // 圖片的高 ÷ 寬
  mind:"",                        // 預先做好的辨識檔，例如 "target.mind"；留空就在手機上即時學習
  box:{x:.08,y:.7355,w:.84,h:.1839}, // 隱藏訊息出現的位置（占整張圖的比例）
  reveal:["寶藏密碼","4 7 2 9"],  // 隱藏訊息，一行一個；第一行小字、其餘大字
  color:"#7a1f12",                // 隱藏訊息的顏色
  answer:["4729"],                // 正確答案，可以有好幾種寫法
  maxTry:5,                       // 答錯幾次後，等 20 秒才能再答
  helpAfter:20,                   // 幾秒還沒對準，「看不到嗎？」就變明顯
  winTitle:"你找到了寶藏密碼！",
  winText:"「真正的寶藏，不在地圖上」，而在看見它的那雙眼睛。"
};
/* ========================== */
const $=id=>document.getElementById(id);
const norm=s=>String(s).normalize("NFKC").replace(/\s+/g,"").toLowerCase();
const T=/[?&]t=1/.test(location.search), EXPORT=/[?&]export=1/.test(location.search);
$("i_eb").textContent=CONFIG.eyebrow;$("i_title").textContent=CONFIG.title;$("i_story").textContent=CONFIG.story;
$("d_title").textContent=CONFIG.winTitle;$("d_text").textContent=CONFIG.winText;
$("showImg").src=CONFIG.target;
if(T)$("tpanel").style.display="block";
const say=(t,c)=>{$("status").textContent=t;$("status").className=c||""};
const note=(t,c)=>{$("msg").textContent=t;$("msg").className=c||""};

/* 隱藏訊息畫在 canvas 上，AR 與備案共用 */
function revealCanvas(W){
  const b=CONFIG.box,cw=Math.round(W*b.w),ch=Math.round(W*CONFIG.ratio*b.h);
  const c=document.createElement("canvas");c.width=cw;c.height=ch;const g=c.getContext("2d");
  const L=CONFIG.reveal,small=Math.round(ch*0.16),big=Math.round(Math.min(ch*0.42,cw/(Math.max(...L.slice(1).map(s=>s.length),1)*0.9)));
  g.textAlign="center";g.textBaseline="middle";g.fillStyle=CONFIG.color;g.shadowColor=CONFIG.color;g.shadowBlur=ch*0.04;
  const font=s=>`700 ${s}px "Noto Serif TC","PingFang TC","Microsoft JhengHei",serif`;
  const total=small+(L.length-1)*big*1.1;let y=(ch-total)/2+small/2;
  L.forEach((t,i)=>{const s=i?big:small;g.font=font(s);g.fillText(t,cw/2,y+(i?big*0.05:0));y+=i?big*1.1:small*1.6});
  return c;
}

/* 備案：直接看圖 + 隱藏訊息 */
function fallback(msg){
  const st=$("fbStage");st.innerHTML="";const img=new Image();img.src=CONFIG.target;st.appendChild(img);
  img.onload=()=>{const W=img.clientWidth,cv=revealCanvas(img.naturalWidth),b=CONFIG.box;cv.style.cssText=`left:${b.x*100}%;top:${b.y*100}%;width:${b.w*100}%;height:${b.h*100}%`;st.appendChild(cv);requestAnimationFrame(()=>$("fb").classList.add("on"))};
  $("fbMsg").textContent=msg||"這是在魔法鏡頭下看到的樣子：";$("fb").style.display="block";
}
$("fbClose").onclick=()=>{$("fb").classList.remove("on");$("fb").style.display="none"};
$("help").onclick=()=>fallback(started?"看不到嗎？這是在魔法鏡頭下看到的樣子：":"");
$("showBtn").onclick=()=>{$("show").style.display="flex"};
$("showClose").onclick=()=>{$("show").style.display="none"};

/* 作答 */
let tries=0,lockUntil=0,won=false;
function submit(){
  if(won)return;const v=norm($("aIn").value);if(!v){note("先輸入答案。","bad");return}
  if(Date.now()<lockUntil){note("魔法還在冷卻，"+Math.ceil((lockUntil-Date.now())/1000)+" 秒後再試。","bad");return}
  if(CONFIG.answer.some(a=>norm(a)===v)){won=true;note("答對了！","ok");setTimeout(()=>{$("done").style.display="flex"},700);return}
  tries++;$("ans").classList.remove("shake");void $("ans").offsetWidth;$("ans").classList.add("shake");
  if(tries>=CONFIG.maxTry){tries=0;lockUntil=Date.now()+20000;note("錯太多次了，魔法需要冷卻 20 秒。再仔細看一次圖上浮現的字。","bad")}
  else note(/^\d+$/.test(v)&&CONFIG.answer.some(a=>/^\d+$/.test(norm(a))&&norm(a).length!==v.length)?"位數不對，再數一次。":"不是這個。答案要從浮現的文字裡找。","bad");
}
$("aGo").onclick=submit;$("aIn").onkeydown=e=>{if(e.key==="Enter")submit()};
$("again").onclick=()=>{won=false;tries=0;$("aIn").value="";note("");$("done").style.display="none"};

/* 辨識檔：預先做好的 > 手機記住的 > 現場學習 */
const DB="mindar-cache";const KEY="t-"+(CONFIG.target.length>200?CONFIG.target.length+CONFIG.target.slice(-40):CONFIG.target);
function idb(mode,fn){return new Promise((ok,no)=>{let r;try{r=indexedDB.open(DB,1)}catch(e){return no(e)}r.onupgradeneeded=()=>r.result.createObjectStore("t");r.onerror=()=>no(r.error);r.onsuccess=()=>{const tx=r.result.transaction("t",mode),q=fn(tx.objectStore("t"));tx.oncomplete=()=>ok(q&&q.result);tx.onerror=()=>no(tx.error)}})}
const cacheGet=k=>idb("readonly",s=>s.get(k)).catch(()=>null), cachePut=(k,b)=>idb("readwrite",s=>s.put(b,k)).catch(()=>null);
const loadImg=src=>new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>no(new Error("圖片載入失敗"));i.src=src});
async function compile(img,onP){
  const m=await import("https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js");
  const C=m.Compiler||(window.MINDAR&&window.MINDAR.IMAGE&&window.MINDAR.IMAGE.Compiler);
  if(!C)throw new Error("找不到 MindAR 編譯器");const c=new C();await c.compileImageTargets([img],onP);return await c.exportData();
}
function dlLink(buf,name,host){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([buf]));a.download=name;a.textContent="下載 "+name;a.style.cssText="display:inline-block;margin-top:8px;font-weight:700";host.appendChild(a)}
async function targetUrl(){
  if(CONFIG.mind){try{const r=await fetch(CONFIG.mind);if(r.ok)return URL.createObjectURL(await r.blob())}catch(e){}}
  const c=await cacheGet(KEY);if(c)return URL.createObjectURL(new Blob([c]));
  say("第一次使用，正在學習這張圖……");
  const buf=await compile(await loadImg(CONFIG.target),p=>say("正在學習這張圖…… "+Math.round(p)+"%"));
  cachePut(KEY,buf);if(EXPORT)dlLink(buf,"target.mind",$("bottom"));
  return URL.createObjectURL(new Blob([buf]));
}

/* 老師工具：換成自己的圖並下載辨識檔 */
$("tFile").onchange=async e=>{const f=e.target.files[0];if(!f)return;$("tMsg").textContent="學習中……";
  try{const img=await loadImg(URL.createObjectURL(f));const buf=await compile(img,p=>$("tMsg").textContent="學習中…… "+Math.round(p)+"%");
    $("tMsg").textContent="學好了。把下載的檔案和網頁放在同一個資料夾，CONFIG 的 target 填圖片檔名、mind 填這個檔名、ratio 填 "+(img.naturalHeight/img.naturalWidth).toFixed(4)+"。";dlLink(buf,f.name.replace(/\.\w+$/,"")+".mind",$("tMsg"))}
  catch(err){$("tMsg").textContent="學習失敗："+(err.message||err)+"（需要連上網路）"}};

/* AR */
let started=false,found=false;
async function start(){
  if(started)return;started=true;$("intro").style.display="none";
  if(!window.isSecureContext){say("要放在 https 網址才能使用相機。");fallback("這個網址不能使用相機，先看看魔法鏡頭下的樣子：");return}
  try{
    const THREE=await import("three");const {MindARThree}=await import("mindar-image-three");
    const url=await targetUrl();say("請允許使用相機……");
    const mind=new MindARThree({container:$("ar"),imageTargetSrc:url,uiLoading:"no",uiScanning:"no",uiError:"no",filterMinCF:0.0001,filterBeta:0.001});
    const {renderer,scene,camera}=mind;
    const tex=new THREE.CanvasTexture(revealCanvas(1000));tex.colorSpace=THREE.SRGBColorSpace;
    const b=CONFIG.box,mat=new THREE.MeshBasicMaterial({map:tex,transparent:true,opacity:0,depthWrite:false});
    const plane=new THREE.Mesh(new THREE.PlaneGeometry(b.w,b.h*CONFIG.ratio),mat);
    plane.position.set(b.x+b.w/2-.5,CONFIG.ratio/2-(b.y+b.h/2)*CONFIG.ratio,0.001);
    const anchor=mind.addAnchor(0);anchor.group.add(plane);
    anchor.onTargetFound=()=>{found=true;say("✨ 看見了！讀出浮現的訊息，輸入答案。","found")};
    anchor.onTargetLost=()=>say("把整張圖放回鏡頭裡。");
    await mind.start();say("把整張圖放進鏡頭裡。");
    renderer.setAnimationLoop(()=>{mat.opacity+=((anchor.group.visible?1:0)-mat.opacity)*0.08;renderer.render(scene,camera)});
    setTimeout(()=>{if(!found){$("help").className="";say("對不準嗎？讓整張圖入鏡、光線亮一點，或按「看不到嗎？」。")}},CONFIG.helpAfter*1000);
  }catch(e){console.error(e);const denied=e&&(e.name==="NotAllowedError"||/Permission|denied/i.test(e.message||""));
    say(denied?"沒有相機權限，無法開啟魔法鏡頭。":"魔法鏡頭開不起來。");
    fallback(denied?"沒有相機權限也沒關係，這是魔法鏡頭下的樣子：":"這支手機開不了魔法鏡頭，這是魔法鏡頭下的樣子：")}
}
$("start").onclick=start;
window.__test={submit,norm,CONFIG};
</script>
</body>
</html>
