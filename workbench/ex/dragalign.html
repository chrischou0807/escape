<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>拖動道具對照底圖</title>
<style>
:root{--bg:#1c2128;--card:#242a32;--line:#ffffff18;--ink:#e7e3da;--dim:#9aa1a9;--brass:#d9b878;--ok:#7fce9b;--bad:#e8857a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:radial-gradient(120% 90% at 50% 10%,#29313a,var(--bg) 50%,#161a20);color:var(--ink);font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;user-select:none;-webkit-user-select:none}
.wrap{max-width:560px;margin:0 auto;padding:18px 14px 40px;display:flex;flex-direction:column;align-items:center;gap:12px}
.eb{color:var(--brass);font-size:12px;letter-spacing:3px}
h1{margin:0;font-size:22px}
.intro{color:var(--dim);font-size:14px;line-height:1.7;text-align:center;max-width:470px}
.msg{min-height:24px;font-size:16px;text-align:center}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:10px 18px;background:var(--brass);color:#2b2010;cursor:pointer}
button.g{background:#ffffff1a;color:var(--ink)}
input{font:inherit;font-size:18px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:#0f1216;color:var(--ink);width:150px;text-align:center;letter-spacing:4px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
.shake{animation:shk .4s}@keyframes shk{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.note{font-size:12px;color:var(--dim);text-align:center;line-height:1.6;max-width:470px}

.board{position:relative;width:340px;height:360px;border-radius:14px;overflow:hidden;background:#f4ead8;touch-action:none}
.board svg.base{position:absolute;inset:0}
.tool{position:absolute;width:86px;height:86px;cursor:grab;touch-action:none;filter:drop-shadow(0 4px 6px #0006)}

</style>
</head>
<body><div class="wrap">
<div class="eb">機關範例</div>
<h1>拖動道具對照底圖</h1>
<div class="intro">把道具拖到底圖上，自己判斷它和哪個地方對得上。畫面不會告訴你對了沒有，答案要靠自己讀出來。</div>

<div class="board" id="board"><svg class="base" viewBox="0 0 340 360" id="base"></svg>
<svg class="tool" id="tool" viewBox="0 0 86 86"><path d="M43 6l11 24 26 3-19 18 5 26-23-13-23 13 5-26L6 33l26-3z" fill="#d9b878cc" stroke="#7a5a20" stroke-width="3"/></svg></div>
<div class="row"><input id="ans" placeholder="數字" inputmode="numeric"><button id="go">送出</button></div>
<div class="msg" id="msg"></div>
<div class="note">老師設定：底圖上畫幾個外框（或樂譜、地圖上的位置），道具換成要對照的形狀；CONFIG.answer 填答案。適合「把搖竹放到樂譜上」「把鑰匙對到鑰匙孔輪廓」這類由玩家自己判斷的對照。（示範：星星對到的外框裡是 5）</div>

</div>
<script>
const $=id=>document.getElementById(id);
function say(t,c){const m=$("msg");m.textContent=t;m.className="msg "+(c||"")}
function shake(e){e.classList.remove("shake");void e.offsetWidth;e.classList.add("shake")}

const CONFIG={answer:"5"};
// 底圖：幾個形狀外框，裡面各有一個數字；道具是星星
const shape=(d,x,y,n)=>'<g transform="translate('+x+' '+y+')"><path d="'+d+'" fill="none" stroke="#5a4a3a" stroke-width="2" stroke-dasharray="5 4"/><text x="43" y="52" font-size="20" font-weight="700" fill="#5a4a3a" text-anchor="middle">'+n+'</text></g>';
const STAR="M43 6l11 24 26 3-19 18 5 26-23-13-23 13 5-26L6 33l26-3z",HEART="M43 76C10 52 6 30 20 18c10-8 20-4 23 6 3-10 13-14 23-6 14 12 10 34-23 58z",MOON="M55 8a36 36 0 1 0 0 70 28 28 0 1 1 0-70z",DROP="M43 6C30 30 16 44 16 58a27 27 0 0 0 54 0C70 44 56 30 43 6z",SQ="M12 12h62v62H12z";
$("base").innerHTML='<text x="170" y="26" font-size="14" fill="#7a6a5a" text-anchor="middle">底圖</text>'+shape(HEART,20,40,2)+shape(STAR,230,50,5)+shape(MOON,130,150,8)+shape(DROP,25,250,1)+shape(SQ,225,250,7);
const b=$("board"),t=$("tool");let tx=128,ty=262,d=null;const place=()=>{t.style.left=tx+"px";t.style.top=ty+"px"};
t.addEventListener("pointerdown",e=>{e.preventDefault();t.setPointerCapture(e.pointerId);const r=b.getBoundingClientRect();d={x:e.clientX-r.left-tx,y:e.clientY-r.top-ty}});
t.addEventListener("pointermove",e=>{if(!d)return;const r=b.getBoundingClientRect();tx=Math.max(-20,Math.min(340-66,e.clientX-r.left-d.x));ty=Math.max(-20,Math.min(360-66,e.clientY-r.top-d.y));place()});
const up=()=>d=null;t.addEventListener("pointerup",up);t.addEventListener("pointercancel",up);place();
$("go").onclick=()=>{if($("ans").value.trim()===CONFIG.answer)say("答對了！","ok");else{shake($("ans"));say("不對，再對對看。","bad")}};

</script>
</body></html>
