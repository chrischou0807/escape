<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>按鍵輸入</title>
<style>
:root{--bg:#1c2128;--card:#242a32;--line:#ffffff18;--ink:#e7e3da;--dim:#9aa1a9;--brass:#d9b878;--ok:#7fce9b;--bad:#e8857a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:radial-gradient(120% 90% at 50% 10%,#29313a,var(--bg) 50%,#161a20);color:var(--ink);font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;user-select:none;-webkit-user-select:none}
.wrap{max-width:560px;margin:0 auto;padding:18px 14px 40px;display:flex;flex-direction:column;align-items:center;gap:12px}
.eb{color:var(--brass);font-size:12px;letter-spacing:3px}
h1{margin:0;font-size:22px}
.intro{color:var(--dim);font-size:14px;line-height:1.7;text-align:center;max-width:470px}
.msg{min-height:24px;font-size:16px;text-align:center}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:10px 18px;background:var(--brass);color:#2b2010;cursor:pointer}
button.g{background:#ffffff1a;color:var(--ink)}
input{font:inherit;font-size:18px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:#0f1216;color:var(--ink);width:150px;text-align:center;letter-spacing:4px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
.shake{animation:shk .4s}@keyframes shk{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.note{font-size:12px;color:var(--dim);text-align:center;line-height:1.6;max-width:470px}

.dev{width:300px;border-radius:18px;padding:18px;background:linear-gradient(#4a525c,#30363d);box-shadow:0 10px 30px #0008}
.scr{height:58px;border-radius:8px;background:#0e1d26;display:flex;align-items:center;justify-content:center;font:700 30px/1 "Courier New",monospace;letter-spacing:8px;color:#f3c443;text-shadow:0 0 8px #f3c44388;margin-bottom:14px}
.keys{display:grid;gap:8px}
.k{height:46px;border-radius:9px;border:1px solid #c0c0c0;background:linear-gradient(135deg,#d6d6d6,#8d8d8d);color:#fff;font:700 20px/46px Arial,sans-serif;text-align:center;cursor:pointer}
.k:active{filter:brightness(1.2)}
.door{margin-top:6px;font-size:40px;min-height:50px}

</style>
</head>
<body><div class="wrap">
<div class="eb">機關範例</div>
<h1>按鍵輸入</h1>
<div class="intro">按鍵盤上的鍵，把密碼打進螢幕。打滿位數會自動檢查：對了螢幕顯示「開啟」，錯了顯示「錯誤」再清空。</div>

<div class="row"><button id="mNum">數字鍵盤</button><button class="g" id="mLet">英文鍵盤</button></div>
<div class="dev" id="dev"><div class="scr" id="scr"></div><div class="keys" id="keys"></div></div>
<div class="door" id="door">🔒</div>
<div class="msg" id="msg"></div>
<div class="note">老師設定：CONFIG.num 是數字鍵盤的密碼，CONFIG.letter 是英文鍵盤的密碼；密碼幾個字，螢幕就收幾個字。（示範密碼：817、BATIK）</div>

</div>
<script>
const $=id=>document.getElementById(id);
function say(t,c){const m=$("msg");m.textContent=t;m.className="msg "+(c||"")}
function shake(e){e.classList.remove("shake");void e.offsetWidth;e.classList.add("shake")}

const CONFIG={num:"817",letter:"BATIK"};
let mode="num",typed="",done=false;
function code(){return mode==="num"?CONFIG.num:CONFIG.letter}
function show(){$("scr").style.color="";$("scr").textContent=typed.padEnd(code().length,"_")}
function press(c){if(done)return;if(c==="⌫"){typed=typed.slice(0,-1);return show()}if(c==="C"){typed="";return show()}
  typed+=c;show();if(typed.length<code().length)return;
  if(typed===code()){done=true;$("scr").textContent="開啟";$("scr").style.color="#7fe39a";$("door").textContent="🔓";say("打開了！","ok")}
  else{$("scr").textContent="錯誤";$("scr").style.color="#ff7a6a";shake($("dev"));setTimeout(()=>{typed="";show()},800)}}
function build(){done=false;typed="";$("door").textContent="🔒";say("");const K=$("keys");K.innerHTML="";
  const list=mode==="num"?["1","2","3","4","5","6","7","8","9","C","0","⌫"]:"ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").concat(["⌫"]);
  K.style.gridTemplateColumns=mode==="num"?"repeat(3,1fr)":"repeat(7,1fr)";
  list.forEach(c=>{const b=document.createElement("div");b.className="k";b.textContent=c;if(mode!=="num")b.style.fontSize="16px";if(c==="⌫"&&mode!=="num")b.style.gridColumn="span 2";b.onclick=()=>press(c);K.appendChild(b)});show()}
$("mNum").onclick=()=>{mode="num";$("mNum").className="";$("mLet").className="g";build()};
$("mLet").onclick=()=>{mode="let";$("mLet").className="";$("mNum").className="g";build()};
build();

</script>
</body></html>
