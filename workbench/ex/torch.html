<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>手電筒探照</title>
<style>
:root{--bg:#1c2128;--card:#242a32;--line:#ffffff18;--ink:#e7e3da;--dim:#9aa1a9;--brass:#d9b878;--ok:#7fce9b;--bad:#e8857a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:radial-gradient(120% 90% at 50% 10%,#29313a,var(--bg) 50%,#161a20);color:var(--ink);font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;user-select:none;-webkit-user-select:none}
.wrap{max-width:560px;margin:0 auto;padding:18px 14px 40px;display:flex;flex-direction:column;align-items:center;gap:12px}
.eb{color:var(--brass);font-size:12px;letter-spacing:3px}
h1{margin:0;font-size:22px}
.intro{color:var(--dim);font-size:14px;line-height:1.7;text-align:center;max-width:470px}
.msg{min-height:24px;font-size:16px;text-align:center}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:10px 18px;background:var(--brass);color:#2b2010;cursor:pointer}
button.g{background:#ffffff1a;color:var(--ink)}
input{font:inherit;font-size:18px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:#0f1216;color:var(--ink);width:150px;text-align:center;letter-spacing:4px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
.shake{animation:shk .4s}@keyframes shk{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.note{font-size:12px;color:var(--dim);text-align:center;line-height:1.6;max-width:470px}

.room{position:relative;width:340px;height:440px;border-radius:14px;overflow:hidden;touch-action:none;background:#0a0b10}
.room svg.scene{position:absolute;inset:0}
.dark{position:absolute;inset:0;background:rgba(5,5,12,.93);pointer-events:none}
.lit{position:absolute;inset:0;pointer-events:none}
.torch{position:absolute;width:90px;height:40px;cursor:grab;touch-action:none;z-index:5}

</style>
</head>
<body><div class="wrap">
<div class="eb">機關範例</div>
<h1>手電筒探照</h1>
<div class="intro">房間一片漆黑。拖著手電筒移動，只有光圈照到的地方看得見，找出藏在牆上的數字。</div>

<div class="room" id="room">
 <svg class="scene" id="s1" viewBox="0 0 340 440"></svg>
 <div class="dark"></div>
 <svg class="lit" id="s2" viewBox="0 0 340 440"></svg>
 <svg class="torch" id="torch" viewBox="0 0 90 40"><rect x="0" y="8" width="18" height="24" rx="4" fill="#ddd" stroke="#555" stroke-width="2"/><rect x="16" y="12" width="70" height="16" rx="6" fill="#c0392b" stroke="#555" stroke-width="2"/></svg>
</div>
<div class="row"><input id="ans" placeholder="數字" inputmode="numeric"><button id="go">送出</button></div>
<div class="msg" id="msg"></div>
<div class="note">老師設定：把場景圖換成自己的（亮、暗各一張，或同一張圖加暗色遮罩），CONFIG.answer 填答案、CONFIG.r 調光圈大小。光圈在手電筒前方。（示範答案：364）</div>

</div>
<script>
const $=id=>document.getElementById(id);
function say(t,c){const m=$("msg");m.textContent=t;m.className="msg "+(c||"")}
function shake(e){e.classList.remove("shake");void e.offsetWidth;e.classList.add("shake")}

const CONFIG={answer:"364",r:62};
// 場景：牆上幾幅畫，數字藏在不同角落
const scene='<rect width="340" height="440" fill="#6b5a4a"/><rect y="330" width="340" height="110" fill="#4a3b2e"/>'
 +'<rect x="30" y="40" width="110" height="80" fill="#c9b48f" stroke="#3a2a1a" stroke-width="6"/><circle cx="85" cy="80" r="22" fill="#e07b39"/>'
 +'<rect x="200" y="60" width="100" height="130" fill="#9fc0c9" stroke="#3a2a1a" stroke-width="6"/><path d="M200 170l40-50 30 35 30-25v60z" fill="#4f7a5a"/>'
 +'<rect x="60" y="200" width="90" height="90" fill="#d7c7e8" stroke="#3a2a1a" stroke-width="6"/><path d="M105 215l12 30h-24z" fill="#7a5ca8"/>'
 +'<rect x="220" y="350" width="90" height="60" fill="#5a3a20"/><circle cx="265" cy="360" r="6" fill="#d9b878"/>';
const hidden='<text x="170" y="34" font-size="34" font-weight="700" fill="#fff8d0" text-anchor="middle">3</text>'
 +'<text x="265" y="245" font-size="34" font-weight="700" fill="#fff8d0" text-anchor="middle">6</text>'
 +'<text x="40" y="390" font-size="34" font-weight="700" fill="#fff8d0">4</text>'
 +'<text x="180" y="300" font-size="12" fill="#fff8d0" text-anchor="middle">由上往下讀</text>';
$("s1").innerHTML=scene;$("s2").innerHTML=scene+hidden;
const room=$("room"),t=$("torch");let tx=240,ty=380,d=null;
function place(){t.style.left=tx+"px";t.style.top=ty+"px";const cx=tx-CONFIG.r+4,cy=ty+20,m="radial-gradient(circle "+CONFIG.r+"px at "+cx+"px "+cy+"px,#000 65%,transparent 100%)";$("s2").style.webkitMaskImage=m;$("s2").style.maskImage=m}
t.addEventListener("pointerdown",e=>{e.preventDefault();t.setPointerCapture(e.pointerId);const r=room.getBoundingClientRect();d={x:e.clientX-r.left-tx,y:e.clientY-r.top-ty}});
t.addEventListener("pointermove",e=>{if(!d)return;const r=room.getBoundingClientRect();tx=Math.max(0,Math.min(340-90,e.clientX-r.left-d.x));ty=Math.max(0,Math.min(440-40,e.clientY-r.top-d.y));place()});
const up=()=>d=null;t.addEventListener("pointerup",up);t.addEventListener("pointercancel",up);place();
$("go").onclick=()=>{if($("ans").value.replace(/\s/g,"")===CONFIG.answer)say("答對了！","ok");else{shake($("ans"));say("不對，再照照看。","bad")}};

</script>
</body></html>
