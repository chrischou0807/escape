<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>117 高低提示猜數字</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --slate:#1c2128; --slate2:#161a20; --graphite:#2a3139; --graphite-lo:#1f242b;
    --brass:#d9b878; --brass-mid:#b8935a; --brass-lo:#8a6d3f; --amber:#ffce78;
    --txt:#e7e3da; --txt-dim:#9aa1a9; --paper:#f4ead8; --line:rgba(255,255,255,.08);
    --good:#7fce9b; --bad:#e8857a;
    --display:"Chakra Petch", system-ui, sans-serif;
    --cjk:"PingFang TC","Microsoft JhengHei","Noto Sans TC", system-ui, sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{font-family:var(--cjk);color:var(--txt);overflow:hidden;user-select:none;-webkit-user-select:none;
    background:radial-gradient(120% 90% at 50% 16%, #29313a 0%, var(--slate) 44%, var(--slate2) 100%);}
  .stage{position:fixed;inset:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding:20px 14px 40px;gap:10px}
  .gear{position:fixed;top:12px;right:12px;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    color:var(--txt-dim);background:rgba(28,33,40,.85);border:1px solid var(--line);cursor:pointer;z-index:40;touch-action:none}
  .gear svg{width:22px;height:22px}
  .gear .ring{position:absolute;inset:-3px;border-radius:50%;border:2px solid var(--brass);clip-path:inset(0 0 100% 0);opacity:.9}
  .gear.holding .ring{clip-path:inset(0 0 0 0);transition:clip-path .6s linear}
  .brandline{font-family:var(--display);font-weight:600;letter-spacing:3px;font-size:11px;color:var(--brass-mid);text-transform:uppercase;padding:0 50px;text-align:center}
  .gtitle{font-size:20px;font-weight:700;margin:0;color:#fff;letter-spacing:1px}
  .intro{max-width:480px;color:var(--txt-dim);font-size:14px;line-height:1.7;text-align:center;white-space:pre-wrap}
  #playHost{width:min(94vw,480px);display:flex;flex-direction:column;align-items:center;gap:12px}
  .hint{min-height:22px;color:var(--amber);font-size:14px;letter-spacing:.5px;text-align:center;padding:0 10px;line-height:1.6}
  .pill{border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--txt);padding:9px 20px;border-radius:999px;font-family:var(--cjk);font-size:13px;cursor:pointer}
  .pill:active{background:rgba(255,255,255,.1)}

  /* 共用元件 */
  .panel{width:100%;background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:14px;padding:14px}
  .q{font-size:16px;line-height:1.7;color:#fff;text-align:center;white-space:pre-wrap}
  .sub{font-size:13px;color:var(--txt-dim);text-align:center;line-height:1.6}
  .opts{display:flex;flex-direction:column;gap:8px;width:100%;margin-top:10px}
  .opts.h{flex-direction:row;flex-wrap:wrap;justify-content:center}
  .opt{border:1px solid var(--line);background:var(--graphite);color:var(--txt);padding:12px 14px;border-radius:11px;font-family:var(--cjk);font-size:15px;cursor:pointer;text-align:center;line-height:1.5}
  .opt:active{background:#343c46}
  .opt.on{border-color:var(--brass);background:#3a3323;color:var(--amber)}
  .opt.good{border-color:var(--good);background:#21382b;color:var(--good)}
  .opt.bad{border-color:var(--bad);background:#3b2422;color:var(--bad)}
  .opt:disabled{opacity:.55;cursor:default}
  .go{border:none;border-radius:12px;padding:12px 26px;font-family:var(--cjk);font-weight:700;font-size:15px;cursor:pointer;background:linear-gradient(180deg,var(--brass),var(--brass-mid));color:#1c1206}
  .go:disabled{opacity:.45}
  .row{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;width:100%}
  .stat{font-family:var(--display);font-size:13px;letter-spacing:1px;color:var(--brass);background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:999px;padding:5px 12px}
  .inp{width:100%;max-width:260px;height:48px;text-align:center;font-size:20px;letter-spacing:3px;font-family:var(--display),var(--cjk);background:#13171c;border:1px solid var(--line);border-radius:12px;color:var(--brass);user-select:text;-webkit-user-select:text}
  .inp:focus{outline:none;border-color:var(--brass-mid)}
  .cell{display:flex;align-items:center;justify-content:center;background:var(--graphite);border:1px solid var(--line);border-radius:7px;font-family:var(--display),var(--cjk);font-weight:600;cursor:pointer;color:var(--txt)}
  .note{background:var(--paper);color:#3b3122;border-radius:6px;padding:10px 12px;font-size:14px;line-height:1.6;box-shadow:0 6px 14px -6px rgba(0,0,0,.6)}
  .shake{animation:shakex .35s}
  @keyframes shakex{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
  .nodrag{touch-action:none}

  /* 成功揭示卡 */
  .reveal{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:radial-gradient(120% 100% at 50% 40%, rgba(255,206,120,.14), rgba(0,0,0,.8) 60%);backdrop-filter:blur(3px);padding:24px}
  .reveal.show{display:flex;animation:fade .4s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .case{position:relative;max-width:520px;width:100%;border-radius:20px;padding:20px;text-align:center;background:linear-gradient(180deg,#3a2e1a,#241c10);border:1px solid rgba(255,255,255,.08);box-shadow:0 30px 70px -20px rgba(0,0,0,.8)}
  .case .tag{font-family:var(--display);letter-spacing:3px;font-size:11px;color:var(--amber);text-transform:uppercase;margin-bottom:12px}
  .paper-empty{border-radius:8px;background:var(--paper);min-height:90px;display:flex;align-items:center;justify-content:center;color:#5a4a2f;font-size:16px;line-height:1.7;padding:20px;white-space:pre-wrap}
  .caption{margin-top:14px;color:#f7e9cf;font-size:16px;line-height:1.7;white-space:pre-wrap}
  .case .close{margin:16px auto 2px;display:block;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.2);color:#fff;padding:10px 26px;border-radius:999px;font-family:var(--cjk);font-size:14px;cursor:pointer}

  /* 密碼框、後台 */
  .gate{position:fixed;inset:0;z-index:48;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(8,10,13,.82);backdrop-filter:blur(3px)}
  .gate.show{display:flex}
  .gate-box{width:100%;max-width:320px;padding:24px;border-radius:18px;background:linear-gradient(180deg,#222932,#1a1f26);border:1px solid var(--line)}
  .gate-title{font-family:var(--display);font-weight:600;letter-spacing:2px;color:#fff;font-size:16px;text-align:center}
  .gate-sub{color:var(--txt-dim);font-size:12px;text-align:center;margin:6px 0 16px}
  .gate-input{width:100%;height:54px;text-align:center;font-size:22px;letter-spacing:6px;font-family:var(--display);background:#13171c;border:1px solid var(--line);border-radius:12px;color:var(--brass)}
  .gate-err{height:18px;color:var(--bad);font-size:13px;text-align:center;margin:9px 0 3px}
  .gate-actions{display:flex;gap:10px}
  .gate-actions button{flex:1;border:none;border-radius:12px;padding:13px;font-family:var(--cjk);font-size:15px;font-weight:600;cursor:pointer}
  .gate-ok{background:linear-gradient(180deg,var(--brass),var(--brass-mid));color:#1c1206}
  .gate-cancel{background:transparent;border:1px solid var(--line)!important;color:var(--txt)}
  .admin{position:fixed;inset:0;z-index:50;display:none;background:linear-gradient(180deg,#13171c,#0e1115);overflow:auto;padding:26px 20px 60px;user-select:text;-webkit-user-select:text}
  .admin.show{display:block}
  .admin-wrap{max-width:560px;margin:0 auto}
  .admin h1{font-family:var(--display);font-weight:700;font-size:22px;margin:6px 0 4px;color:#fff}
  .admin .sub{text-align:left;margin-bottom:22px}
  .field{margin-bottom:22px}
  .field>label{display:block;font-size:14px;color:var(--txt);font-weight:600;margin-bottom:10px}
  .field .desc{color:var(--txt-dim);font-size:12px;margin-top:8px;line-height:1.6}
  .url-input{width:100%;background:#1c2026;border:1px solid var(--line);border-radius:11px;color:var(--txt);padding:12px 14px;font-size:14px;font-family:var(--cjk)}
  textarea.url-input{min-height:64px;resize:vertical}
  textarea.code{min-height:260px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:1.5;white-space:pre}
  .toggle{display:flex;align-items:center;gap:12px}
  .switch{position:relative;width:50px;height:28px;border-radius:999px;background:#2a313a;cursor:pointer;flex:none}
  .switch.on{background:var(--brass-mid)}.switch i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s}.switch.on i{left:25px}
  .actions{display:flex;gap:12px;margin-top:26px;flex-wrap:wrap}
  .btn{flex:1;min-width:130px;border:none;border-radius:13px;padding:14px;font-family:var(--cjk);font-size:15px;font-weight:600;cursor:pointer}
  .btn.primary{background:linear-gradient(180deg,var(--brass),var(--brass-mid));color:#1c1206}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}
  .saved{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);opacity:0;background:#222;color:#fff;padding:11px 22px;border-radius:999px;font-size:14px;pointer-events:none;transition:.3s;border:1px solid var(--line);z-index:62}
  .saved.show{opacity:1;transform:translateX(-50%)}
  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="gear" id="gear" title="長按進入後台"><span class="ring"></span>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
</div>

<div class="stage" id="stage">
  <div class="brandline" id="brand"></div>
  <h1 class="gtitle" id="gtitle"></h1>
  <div class="intro" id="intro"></div>
  <div id="playHost"></div>
  <div class="hint" id="hint"></div>
  <button class="pill" id="restart">重新開始</button>
</div>

<div class="reveal" id="reveal"><div class="case">
  <div class="tag">SOLVED · 過關</div>
  <div class="paper-empty" id="paper"></div>
  <div class="caption" id="caption"></div>
  <button class="close" id="closeReveal">收起</button>
</div></div>

<div class="gate" id="gate"><div class="gate-box" id="gateBox">
  <div class="gate-title">後台密碼</div><div class="gate-sub">請輸入密碼以進入設定</div>
  <input class="gate-input" id="gateInput" type="password" autocomplete="off" placeholder="••••">
  <div class="gate-err" id="gateErr"></div>
  <div class="gate-actions"><button class="gate-cancel" id="gateCancel">取消</button><button class="gate-ok" id="gateOk">進入</button></div>
</div></div>

<div class="admin" id="admin"><div class="admin-wrap">
  <h1>後台設定</h1>
  <div class="sub">設定這個機關的內容，玩家不會看到這個畫面。</div>
  <div class="field"><label>題目內容（JSON）</label>
    <textarea class="url-input code" id="dataInput" spellcheck="false"></textarea>
    <div class="desc">直接改引號裡的文字與數字即可；保留括號、逗號與引號。格式有誤時不會儲存。</div>
    <div class="actions" style="margin-top:12px"><button class="btn ghost" id="resetBtn">還原預設內容</button></div>
  </div>
  <div class="field"><label>成功後說明文字（選填）</label><textarea class="url-input" id="capInput" placeholder="例如：把線索交給關主。"></textarea></div>
  <div class="field"><label>音效</label><div class="toggle"><div class="switch" id="soundSwitch"><i></i></div><span style="color:var(--txt-dim);font-size:14px">操作與完成音效</span></div></div>
  <div class="field"><label>後台密碼</label><input class="url-input" id="adminPassInput" type="text" autocomplete="off"><div class="desc">留空會回復預設 9633。</div></div>
  <div class="field"><label>分享連結</label>
    <div class="actions" style="margin-top:0"><button class="btn ghost" id="shareBtn">產生分享連結</button></div>
    <textarea class="url-input" id="shareOut" readonly style="margin-top:10px;display:none"></textarea>
    <div class="desc">把目前設定編碼成一條網址。連結內含答案，適合課堂使用。</div>
  </div>
  <div class="actions"><button class="btn ghost" id="previewBtn">預覽前台</button><button class="btn primary" id="saveBtn">儲存並返回</button></div>
</div></div>
<div class="saved" id="toast">已儲存</div>

<script>
(function(){
"use strict";
var GAME={no:'117',slug:'hilo',title:'高低提示猜數字',brand:'HOT POTATO',type:'解謎',
intro:'每一題的答案都是一個數字。送出後會告訴你正確答案「更高」或「更低」。\n引信有多長沒有人知道，在爆炸前答對越多題越好。',
data:{minTime:60,maxTime:120,need:3,questions:[
 {q:'成年人的身體有幾塊骨頭？',a:206,start:150},{q:'水的沸點是華氏幾度？',a:212,start:180},{q:'銀的原子序是多少？',a:47,start:30},
 {q:'人類第一次登陸月球是西元哪一年？',a:1969,start:1950},{q:'標準鋼琴有幾個琴鍵？',a:88,start:60}]},
build:function(host,D,G){
  const qs=G.shuffle(D.questions); let k=0, right=0, val=0, over=false;
  const endAt=Date.now()+1000*(D.minTime+Math.random()*(D.maxTime-D.minTime));
  const fuse=G.el('div','q','🧨',host); fuse.style.fontSize='40px'; const stat=G.el('div','stat','',host);
  const p=G.el('div','panel',null,host), q=G.el('div','q','',p), row=G.el('div','row',null,p); row.style.marginTop='10px';
  const mk=(t,d)=>{ const b=G.el('button','opt',t,row); b.style.padding='10px 8px'; b.dataset.d=d; b.addEventListener('click',()=>{val=Math.max(0,val+d);inp.value=val;G.tick();}); return b; };
  mk('−10',-10); mk('−1',-1); const inp=G.el('input','inp',null,row); inp.type='number'; inp.style.maxWidth='110px'; mk('+1',1); mk('+10',10);
  inp.addEventListener('input',()=>{val=parseInt(inp.value,10)||0;});
  const go=G.el('button','go','送出',host);
  function show(){ const it=qs[k]; G.t={answer:it.a}; q.textContent=it.q; val=it.start||0; inp.value=val; stat.textContent='已答對 '+right+' 題（目標 '+D.need+' 題）'; }
  function finish(boom){ if(over)return; over=true; go.disabled=true;
    if(right>=D.need){ G.solve((boom?'轟！不過你在爆炸前答對了 ':'全部答完，答對了 ')+right+' 題，過關！'); }
    else { fuse.textContent='💥'; G.buzz(); G.hint('爆炸了！只答對 '+right+' 題，要 '+D.need+' 題。再來一次。'); G.later(()=>G.restart(),2200); } }
  go.addEventListener('click',()=>{ if(over)return; const it=qs[k]; val=parseInt(inp.value,10)||0;
    if(val===it.a){ right++; G.ok(); G.hint('答對了！'); k++; if(k>=qs.length){ finish(false); return; } show(); }
    else { G.buzz(); G.hint(val<it.a?'⬆ 正確答案更高':'⬇ 正確答案更低'); } });
  G.every(()=>{ if(over)return; fuse.style.transform='rotate('+(G.rnd(13)-6)+'deg)'; if(Date.now()>=endAt)finish(true); },250);
  show();
}};
var $=function(id){return document.getElementById(id);};
var KEY="escape.ex"+GAME.no+".v1", mem=null;
function clone(o){return JSON.parse(JSON.stringify(o));}
function load(){ try{var s=localStorage.getItem(KEY); if(s)return JSON.parse(s);}catch(e){} return mem; }
function save(c){ mem=c; try{localStorage.setItem(KEY,JSON.stringify(c));}catch(e){} }
function enc(o){ return btoa(unescape(encodeURIComponent(JSON.stringify(o)))); }
function dec(s){ return JSON.parse(decodeURIComponent(escape(atob(s)))); }
var cfg=load()||{};
try{ var m=location.search.match(/[?&]c=([^&]+)/); if(m){ cfg=dec(decodeURIComponent(m[1])); } }catch(e){}
function normalize(c){
  if(!c.data||typeof c.data!=="object")c.data=clone(GAME.data);
  c.caption=c.caption||""; c.sound=c.sound!==false;
  if(typeof c.adminPass!=="string"||c.adminPass==="")c.adminPass="9633";
}
normalize(cfg);

/* 音效 */
var actx=null;
function ac(){ if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}} return actx; }
function tone(f,d,t,g){ if(!cfg.sound)return; var c=ac(); if(!c)return; try{var o=c.createOscillator(),gn=c.createGain();o.type=t||"sine";o.frequency.value=f;gn.gain.value=g||0.05;o.connect(gn);gn.connect(c.destination);var tt=c.currentTime;gn.gain.exponentialRampToValueAtTime(0.0001,tt+d);o.start(tt);o.stop(tt+d);}catch(e){} }

var host=$("playHost"), hintEl=$("hint"), solved=false, timers=[], cleaners=[];
var G={
  el:function(tag,cls,txt,parent){ var e=document.createElement(tag); if(cls)e.className=cls; if(txt!=null)e.textContent=txt; if(parent)parent.appendChild(e); return e; },
  shuffle:function(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;} return a; },
  rnd:function(n){ return Math.floor(Math.random()*n); },
  tone:tone,
  ok:function(){ tone(660,0.1,"sine",0.05); setTimeout(function(){tone(880,0.14,"sine",0.05);},80); },
  tick:function(){ tone(420,0.05,"square",0.025); },
  buzz:function(){ tone(150,0.18,"sawtooth",0.05); },
  hint:function(t){ hintEl.textContent=t||""; },
  later:function(fn,ms){ var id=setTimeout(fn,ms); timers.push(function(){clearTimeout(id);}); return id; },
  every:function(fn,ms){ var id=setInterval(fn,ms); timers.push(function(){clearInterval(id);}); return id; },
  onClean:function(fn){ cleaners.push(fn); },
  shake:function(e){ e.classList.remove("shake"); void e.offsetWidth; e.classList.add("shake"); },
  solved:function(){ return solved; },
  restart:function(){ build(); },
  solve:function(msg){ if(solved)return; solved=true; tone(523,0.16,"sine",0.06); setTimeout(function(){tone(659,0.16,"sine",0.06);},110); setTimeout(function(){tone(784,0.16,"sine",0.06);},220); setTimeout(function(){tone(1047,0.3,"sine",0.06);},330);
    setTimeout(function(){ $("paper").textContent=msg||GAME.done||"過關！"; $("caption").textContent=cfg.caption||""; $("caption").style.display=cfg.caption?"block":"none"; $("reveal").classList.add("show"); },450); },
  /* 選擇題：opts 會打亂顯示；cb(是否答對, 被按的按鈕) */
  mc:function(parent,q,opts,ans,cb,keep){
    var box=G.el("div","panel",null,parent); if(q)G.el("div","q",q,box);
    var wrap=G.el("div","opts",null,box), done=false;
    G.shuffle(opts.map(function(o,i){return i;})).forEach(function(i){
      var b=G.el("button","opt",opts[i],wrap); b.dataset.i=i;
      b.addEventListener("click",function(){ if(done)return; ac(); var right=(i===ans);
        if(right||!keep){ done=true; [].forEach.call(wrap.children,function(x){x.disabled=true;}); }
        b.classList.add(right?"good":"bad"); if(!right&&keep)b.disabled=true;
        if(right)G.ok(); else G.buzz(); cb(right,b); });
    });
    return box;
  },
  /* 拖曳：h.start(e) / h.move(dx,dy,e) / h.end(e) */
  drag:function(el,h){
    el.classList.add("nodrag"); var sx=0,sy=0,on=false;
    el.addEventListener("pointerdown",function(e){ ac(); on=true; sx=e.clientX; sy=e.clientY; try{el.setPointerCapture(e.pointerId);}catch(_){} if(h.start)h.start(e); e.preventDefault(); });
    el.addEventListener("pointermove",function(e){ if(!on)return; if(h.move)h.move(e.clientX-sx,e.clientY-sy,e); });
    function up(e){ if(!on)return; on=false; if(h.end)h.end(e); }
    el.addEventListener("pointerup",up); el.addEventListener("pointercancel",up);
  },
  /* 找出座標底下符合 selector 的元素（忽略 ignore） */
  under:function(x,y,sel,ignore){ var list=document.elementsFromPoint(x,y); for(var i=0;i<list.length;i++){ if(list[i]===ignore||(ignore&&ignore.contains(list[i])))continue; var t=list[i].closest(sel); if(t&&t!==ignore)return t; } return null; }
};
window.G=G;

function build(){
  timers.forEach(function(f){f();}); timers=[]; cleaners.forEach(function(f){try{f();}catch(e){}}); cleaners=[];
  solved=false; $("reveal").classList.remove("show"); host.innerHTML=""; G.hint("");
  try{ GAME.build(host,cfg.data,G); }
  catch(err){ console.error(err); cfg.data=clone(GAME.data); save(cfg); host.innerHTML=""; G.hint("內容設定有誤，已還原預設內容。"); GAME.build(host,cfg.data,G); }
}
$("brand").textContent="No."+GAME.no+" · "+GAME.type+" · "+GAME.brand;
$("gtitle").textContent=GAME.title; $("intro").textContent=GAME.intro||"";
$("restart").addEventListener("click",function(){ ac(); build(); });
$("closeReveal").addEventListener("click",function(){ $("reveal").classList.remove("show"); build(); });

/* 齒輪 → 密碼 → 後台 */
var gear=$("gear"), holdTimer=null;
function cancelHold(){ gear.classList.remove("holding"); clearTimeout(holdTimer); }
gear.addEventListener("pointerdown",function(e){e.preventDefault(); gear.classList.add("holding"); holdTimer=setTimeout(openGate,600);});
["pointerup","pointerleave","pointercancel"].forEach(function(n){gear.addEventListener(n,cancelHold);});
var gate=$("gate"), gateInput=$("gateInput");
function openGate(){ cancelHold(); $("gateErr").textContent=""; gateInput.value=""; gate.classList.add("show"); setTimeout(function(){try{gateInput.focus();}catch(e){}},60); }
function tryGate(){ if(gateInput.value===cfg.adminPass){ gate.classList.remove("show"); openAdmin(); } else { $("gateErr").textContent="密碼錯誤"; G.shake($("gateBox")); gateInput.value=""; } }
$("gateOk").addEventListener("click",tryGate);
$("gateCancel").addEventListener("click",function(){gate.classList.remove("show");});
gateInput.addEventListener("keydown",function(e){ if(e.key==="Enter")tryGate(); });

var admin=$("admin"), draftSound=true;
function openAdmin(){ $("dataInput").value=JSON.stringify(cfg.data,null,2); $("capInput").value=cfg.caption; draftSound=cfg.sound; $("soundSwitch").classList.toggle("on",draftSound); $("adminPassInput").value=cfg.adminPass; $("shareOut").style.display="none"; admin.classList.add("show"); }
$("soundSwitch").addEventListener("click",function(){ draftSound=!draftSound; $("soundSwitch").classList.toggle("on",draftSound); });
$("resetBtn").addEventListener("click",function(){ $("dataInput").value=JSON.stringify(GAME.data,null,2); toast("已填回預設內容，按儲存才會生效"); });
function commit(){
  var d; try{ d=JSON.parse($("dataInput").value); if(!d||typeof d!=="object")throw 0; }catch(e){ toast("題目內容格式有誤，沒有儲存"); return false; }
  cfg.data=d; cfg.caption=$("capInput").value; cfg.sound=draftSound; cfg.adminPass=$("adminPassInput").value||"9633";
  normalize(cfg); save(cfg); build(); return true;
}
$("saveBtn").addEventListener("click",function(){ if(commit()){ admin.classList.remove("show"); toast("已儲存"); } });
$("previewBtn").addEventListener("click",function(){ if(commit())admin.classList.remove("show"); });
$("shareBtn").addEventListener("click",function(){ if(!commit())return; var u=location.href.split("?")[0].split("#")[0]+"?c="+encodeURIComponent(enc(cfg)); var o=$("shareOut"); o.value=u; o.style.display="block"; o.select(); try{navigator.clipboard.writeText(u); toast("已複製分享連結");}catch(e){ toast("請手動複製連結"); } });
var toastEl=$("toast"), toastT=null;
function toast(m){ toastEl.textContent=m; toastEl.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(function(){toastEl.classList.remove("show");},1800); }

build();
})();
</script>
</body>
