<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>找尋千島珍珠</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#1d1a17;overflow:hidden;font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:1200px;height:675px;transform-origin:center center;background:#fff;overflow:hidden;flex:none;user-select:none;-webkit-user-select:none}
.scene{position:absolute;inset:0;display:none}
.scene.on{display:block}
.scene img{position:absolute;pointer-events:none;-webkit-user-drag:none}
.hit{position:absolute;cursor:pointer;z-index:500}
.btn{position:absolute;z-index:600;border:0;border-radius:999px;background:#3e4347e6;color:#fff;font:700 22px/1 inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px #0004}
.btn:active{transform:scale(.95)}
.hide{display:none!important}
.pop{animation:pop .6s ease-out}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.glow{filter:drop-shadow(0 0 18px #fff6b0)}
.shake{animation:shk .4s}
@keyframes shk{20%,60%{translate:-10px 0}40%,80%{translate:10px 0}}
.toast{position:absolute;left:50%;top:22px;translate:-50% 0;z-index:900;background:#000c;color:#fff;font-size:22px;padding:10px 22px;border-radius:999px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
.hint{position:absolute;right:16px;bottom:16px;z-index:700;background:#ffffffd9;color:#333;border:0;border-radius:999px;padding:8px 16px;font-size:18px;cursor:pointer}
.hintbox{position:absolute;right:16px;bottom:64px;z-index:700;max-width:420px;background:#fffbe6;border:2px solid #e6c766;border-radius:14px;padding:12px 16px;font-size:20px;line-height:1.6;color:#4a3a10;display:none}
/* laptop */
.key{position:absolute;z-index:520;border-radius:10px;border:1px solid silver;background:linear-gradient(135deg,#c9c9c9,#8d8d8d);color:#fff;font:700 24px/44px Arial,sans-serif;text-align:center;cursor:pointer}
.key:active{filter:brightness(1.2)}
.screen{position:absolute;z-index:520;display:flex;align-items:center;justify-content:center;font:700 30px/1 "Courier New",monospace;letter-spacing:6px;color:#f3c443;text-shadow:0 0 8px #f3c44388}
.pad{position:absolute;z-index:520;width:36px;height:36px;border-radius:7px;border:1px solid silver;background:linear-gradient(135deg,#d0d0d0,#8d8d8d);color:#fff;font:700 20px/36px Arial,sans-serif;text-align:center;cursor:pointer}
.pad:active{filter:brightness(1.2)}
canvas.scratch{position:absolute;z-index:300;touch-action:none;cursor:crosshair}
/* jigsaw */
.pc{position:absolute;z-index:400;background-repeat:no-repeat;cursor:pointer;outline:1px solid #fff8;transition:left .25s,top .25s}
.pc.sel{outline:4px solid #ffd54a;z-index:410}
.wheel{position:absolute;z-index:450;cursor:pointer;overflow:hidden}
.wheel img{position:static!important;width:100%;height:100%}
#rot{position:fixed;inset:0;z-index:99;background:#1d1a17;color:#f1e8d8;display:none;align-items:center;justify-content:center;text-align:center;font-size:20px;line-height:1.8;padding:30px}
@media (orientation:portrait) and (max-width:700px){#rot{display:flex}}
#rot button{margin-top:10px;font:inherit;border:0;border-radius:999px;padding:8px 18px;background:#d9b878}
.modal{position:absolute;inset:0;z-index:950;background:#000a;display:none;align-items:center;justify-content:center}
.modal.on{display:flex}
.modal .box{background:#fff;padding:20px;border-radius:12px;max-width:80%;max-height:85%;overflow:auto;text-align:center}
.modal img{position:static!important;max-width:100%;max-height:520px}
</style>
</head>
<body>
<div id="rot"><div>建議把手機<b>轉成橫向</b>，或用電腦遊玩。<br><button onclick="this.parentNode.parentNode.style.display='none'">直接玩</button></div></div>
<div id="wrap"><div id="stage"><div class="toast" id="toast"></div><div class="modal" id="modal"><div class="box" id="mbox"></div></div></div></div>
<script>
/* 原作：劉宛純〈找尋千島珍珠〉（Genially）。圖片沿用原作素材。 */
const G="https://compressed-images.genially.com/img/";
const P={ // 素材路徑
 cover:"625c34165bc367001879284f/9e8abfe5-830a-4f0b-9ce9-09622b844418.png",
 grid:"625c34165bc367001879284f/8c0f3783-5f63-4644-bc0b-585bcc79164b.jpeg",
 pKeris:"625c34165bc367001879284f/018fc5a8-1e81-4ccb-b8f7-e9c478586b93.png",
 pBatik:"625c34165bc367001879284f/8544f0d7-3d9e-456b-a95d-d7fc199d0996.png",
 pAngk:"625c34165bc367001879284f/c3433f1d-fb9c-4123-a6f9-ebb29a63ffc7.png",
 pKecak:"625c34165bc367001879284f/63d470bc-e09d-4a64-b554-1750c284392e.png",
 swDown:"6218e9d051341d0011a34e0e/e3b71289-1e4e-4605-9c22-801e732333ea.png",
 swUp:"6218e9d051341d0011a34e0e/5945f9fa-cf64-4831-ab64-edc8c9dc8499.png"
};
const LET=["f51826a6-8982-43b5-b987-9101fb667d65","d59dec7f-227a-44ef-826a-c8ae224328e7","6bd5e133-7596-4f4f-9746-4cf6e745fbdc","9397b286-a8e2-4feb-852d-cd7e342deec0","9894e132-ed00-404f-b9e6-0331378b0085","513684a3-f293-4ba5-b471-a84fae6b574b","5fc38f42-7ec7-4be0-bd74-be34f481bab6","d687388d-2f59-4cc8-baf5-c7d779b1e27a","13913aa0-c8c4-4214-b6cb-2f9190abb356","f4a7f6d8-6ac4-499c-96b4-34f53ab2eea9","2afa0963-0f3d-4f90-9448-92312c59f530","b5bc6b58-f295-4ad6-8a9e-288ab5412e4b","d84e7a53-a816-497e-9449-dcfd0655aa5d","d29ba81f-59f6-416e-bed6-4a0bcc33ba63","4c2cc7c8-e9d4-4810-81a7-9f59ca5dba08","2ad7ac1e-d788-4b09-be04-a860fb6cab50","badf0b32-dbcf-4446-bd12-746cba134490","a58c0a82-6bfb-45c4-82df-287fa6d67ab4","e4db1420-cca4-4df2-9394-fb38de627d6b","4ffeba22-2982-457a-b114-61038b33fcbf","3cb3d415-2e76-453d-a0b8-1ec2476d3157","83827032-cda9-4717-be0b-476984b6e5bb","49af978f-38d9-4a24-8c79-88f02653b46a","806b3462-0732-4f25-a1df-ddfb5e33e978","be7efe9b-d637-4633-abad-4b098ed04d1b","af3cbcf8-cc2e-4551-8851-57c40686612b"].map(s=>"5de3e5f6d118ca0fa8bc48ac/"+s+".png");
const DIG=["d0f1fe55-c965-4cbc-864f-7c2b149d5666","e2b62921-6c9d-447c-8eac-35844ce94c04","a50a1b4c-b675-4468-9490-5fc9279fe562","247c1c0d-cbdd-4741-8ad3-262782942c61","5ecc7437-3844-4914-9eb1-72b0b3b6c666","513bd551-c987-41e0-a717-ecc85adab143","c263fbb3-8903-40ef-b0af-bd3e2d951926","c6444ddb-cd4d-48a9-afdf-aaf3aecafa4c","b8752180-3a80-4a76-b25d-e8d5ec5813b1"].map(s=>"5de3e5f6d118ca0fa8bc48ac/"+s+".png");
const src=p=>p.startsWith("http")?p:G+p+"/format=webp";

/* ===== 工具 ===== */
const stage=document.getElementById("stage");
function fit(){const s=Math.min(innerWidth/1200,innerHeight/675);stage.style.transform="scale("+s+")"}
addEventListener("resize",fit);fit();
let T=null;function toast(t,ms){const e=document.getElementById("toast");e.textContent=t;e.classList.add("on");clearTimeout(T);T=setTimeout(()=>e.classList.remove("on"),ms||1600)}
function modal(html){document.getElementById("mbox").innerHTML=html;document.getElementById("modal").classList.add("on")}
document.getElementById("modal").onclick=()=>document.getElementById("modal").classList.remove("on");
function mk(tag,cls,css,parent){const e=document.createElement(tag);if(cls)e.className=cls;if(css)e.style.cssText=css;(parent||stage).appendChild(e);return e}
/* 原作的裁切（上、左、右、下，單位：元件寬高的百分比） */
const CROP={"0099cbd8":[2.93,-8.32,-15,-1.51],"5b4167f5":[0,-9.6,-9.6,0],"f85a19cc":[0,-6.75,-14.33,-2.49],"a10916a4":[-31.92,0,0,-49.39],"0c6c9d71":[0,-1.27,-1.27,0],"583e2d63":[-67.27,-73.04,-59.42,-68.5],"8741a4b6":[0,-9.6,-9.6,0],"736229e1":[0,-11.8,-11.8,0],"edc7758a":[0,-10,-10,0],"bf24d97a":[-13.29,0,0,-32.02],"0fa07f31":[0,-9.6,-9.6,0],"119d5420":[0,-11.8,-11.8,0],"c6ccb645":[0,-10,-10,0],"e0f473b0":[0,0,0,-34.46],"d72d2e55":[0,0,0,-38.54],"84dc6271":[0,-9.6,-9.6,0],"b1a66ef5":[0,-11.8,-11.8,0],"6e9f819a":[0,-10,-10,0],"46594575":[0,-9.6,-9.6,0],"8eaab656":[0,-11.8,-11.8,0],"e6171c6d":[0,-10,-10,0],"f55ac4c0":[-3.69,0,0,-10.22],"7df8b45f":[-27.61,-6,-6.17,-273.11],"8da2328c":[-41.73,-3.34,-2.54,-26.63],"524227fc":[-26.66,-26.66,-25.03,-25.03],"e732d79b":[-36.32,-36.32,-32.82,-32.82],"51a48e49":[-25.13,-10.5,-12.67,-26.16],"834ec1c9":[-34.1,-26.51,-14.61,-25.33],"7bcac5f4":[-35.1,-35.1,-32.87,-32.87]};
function img(sc,p,x,y,w,h,r,z){const box="left:"+x+"px;top:"+y+"px;width:"+w+"px;height:"+h+"px;"+(r?"transform:rotate("+r+"deg);":"")+"z-index:"+(z||1);
  const c=CROP[(p.split("/").pop()||"").slice(0,8)];
  if(!c){const e=mk("img","",box,sc);e.src=src(p);e.alt="";e.draggable=false;return e}
  const d=mk("div","","position:absolute;overflow:hidden;pointer-events:none;"+box,sc);const[t,l,rr,b]=c;
  const e=mk("img","","left:"+(l*w/100)+"px;top:"+(t*h/100)+"px;width:"+(w*(100-l-rr)/100)+"px;height:"+(h*(100-t-b)/100)+"px",d);e.src=src(p);e.alt="";e.draggable=false;return d}
function hit(sc,x,y,w,h,fn,title){const e=mk("div","hit","left:"+x+"px;top:"+y+"px;width:"+w+"px;height:"+h+"px",sc);e.onclick=fn;if(title)e.title=title;return e}
function btn(sc,x,y,w,h,label,fn,extra){const e=mk("button","btn","left:"+x+"px;top:"+y+"px;width:"+w+"px;height:"+h+"px;"+(extra||""),sc);e.innerHTML=label;e.onclick=fn;return e}
function hintBtn(sc,lines){const b=mk("button","hint","",sc);b.textContent="💡 提示";const box=mk("div","hintbox","",sc);let n=0;b.onclick=()=>{n=Math.min(n+1,lines.length);box.innerHTML=lines.slice(0,n).map((l,i)=>"<div>"+(i+1)+". "+l+"</div>").join("");box.style.display="block";b.textContent=n<lines.length?"💡 再一個提示":"💡 提示"}}

const scenes=[];let cur=0;
function scene(build){const sc=mk("div","scene");const api={el:sc,enter:null};build(sc,api);scenes.push(api);return scenes.length-1}
function go(i){scenes[cur].el.classList.remove("on");cur=i;scenes[i].el.classList.add("on");if(scenes[i].enter)scenes[i].enter();try{sessionStorage.setItem("pearl-scene",i)}catch(e){}}
const next=()=>go(cur+1), back=()=>go(Math.max(0,cur-1));
const navBack=sc=>btn(sc,12,558,52,52,"‹",back,"font-size:34px");
const navNext=(sc,label)=>btn(sc,156,513,60,60,label||"›",next,"font-size:34px");

/* 調查報告（筆記本）：先看到封面，點一下翻開 */
function report(L){return scene((sc,api)=>{
  L.base.forEach(a=>img(sc,...a));
  const cover=L.cover.map(a=>img(sc,...a));
  cover.forEach(e=>e.style.zIndex=300);
  const open=hit(sc,300,0,820,675,()=>{cover.forEach(e=>e.classList.add("hide"));open.classList.add("hide")},"翻開報告");
  api.enter=()=>{cover.forEach(e=>e.classList.remove("hide"));open.classList.remove("hide")};
  if(L.back!==false)navBack(sc);navNext(sc,L.nextLabel);
})}

/* ===== 0 封面 ===== */
scene(sc=>{img(sc,P.cover,-14,-6,1225,689);
  btn(sc,519,470,160,52,"START&nbsp;›",next,"border-radius:8px;font-size:22px;letter-spacing:1px");
  mk("div","","position:absolute;right:30px;bottom:22px;color:#e8b23a;font-size:18px;z-index:5",sc).textContent="製作 / 劉宛純";
});

/* ===== 1 訪查報告一 ===== */
report({base:[["625c34165bc367001879284f/5b4167f5-f336-4783-8b25-1cae1a31d37a.png",725,9,376,634,0,2],
  ["625c34165bc367001879284f/f85a19cc-beb4-4a73-be37-6dc7f628a46f.png",327,-24,398,675,0,3],
  ["625c34165bc367001879284f/9e44ec51-fe3d-4aa6-a5cd-5dd93e2e9e72.png",17,157,340,340,0,4]],
  cover:[["5ea4b72c1f18b00fbf2889bd/31365fe9-13e7-4c88-8e72-cf500e9d1f4e.png",348,24,377,630],["625c34165bc367001879284f/0099cbd8-3250-4160-a453-38d3a5d1a87d.png",725,-31,386,674]],
  back:false,nextLabel:"🔒"});

/* ===== 2 寶箱：八個開關 ===== */
scene((sc,api)=>{
  img(sc,P.grid,0,0,1200,675);
  const closed=img(sc,"625c34165bc367001879284f/a10916a4-c435-46aa-9d05-abbfe4f91e06.png",423,320,608,335,0,2);
  const lid=img(sc,"625c34165bc367001879284f/a614f58d-6b31-40e9-83d9-aa78f892e8d9.png",421,59,608,608,0,31);
  const arrow=img(sc,"625c34165bc367001879284f/0c6c9d71-a4c9-43a5-9aed-fbdd9666c95c.png",118,370,193,198,-10.5,33);
  const pearl=img(sc,"625c34165bc367001879284f/62f31fb3-6ffe-4b3f-9efe-de43c84dbffb.png",260,164,352,352,-34.2,47);
  // 開關：0=壓下(白格) 1=拉起(紅格)；解答依面板顏色「上紅下白」
  const POS=[[691,460],[691,499],[691,537],[691,578],[750,460],[750,499],[750,537],[750,578]];
  const SOL=[0,1,0,1,1,0,0,1];
  const st=POS.map(()=>0), sw=POS.map(([x,y])=>img(sc,P.swDown,x,y,32,27,0,40));
  img(sc,"625c34165bc367001879284f/583e2d63-272d-4c01-aa5d-de61ac265059.png",666,436,133,186,0,36);
  let solved=false;
  POS.forEach(([x,y],i)=>hit(sc,x-6,y-5,44,38,()=>{if(solved)return;st[i]^=1;sw[i].src=src(st[i]?P.swUp:P.swDown);
    if(st.every((v,k)=>v===SOL[k])){solved=true;closed.classList.add("hide");[lid,arrow,pearl].forEach(e=>{e.classList.remove("hide");e.classList.add("pop")});ph.classList.remove("hide");toast("寶箱打開了！點珍珠收下它")}}));
  const ph=hit(sc,250,150,370,370,next,"收下珍珠");
  api.enter=()=>{if(!solved){[lid,arrow,pearl,ph].forEach(e=>e.classList.add("hide"))}};
  navBack(sc);
  hintBtn(sc,["開關有兩種狀態：拉起來、壓下去。","面板上的格子有紅、有白。","再讀一次訪查報告一：國旗「上紅下白」。","紅格拉起來，白格壓下去。"]);
});

/* ===== 3 訪查報告二 ===== */
report({base:[["625c34165bc367001879284f/8741a4b6-d206-4428-9c02-f02a020b5205.png",725,4,373,629,0,1],
  ["625c34165bc367001879284f/fffa56d7-e9b1-4198-a678-f3c54e6132d2.png",295,-20,478,677,0,16],
  [P.pKeris,158,199,123,123,0,20]],
  cover:[["625c34165bc367001879284f/edc7758a-53bb-4480-85c4-d40a2c2cd95e.png",332,-23,404,686],["625c34165bc367001879284f/736229e1-d30a-469a-9968-2fb950b4019d.png",725,4,362,633]]});

/* ===== 4 蠟染：刮開 + 筆電輸入 ===== */
scene((sc,api)=>{
  img(sc,"625c34165bc367001879284f/bf24d97a-6176-4230-a832-9805a44ca563.png",595,178,594,471,0,10);
  // 刮刮層：原作畫著銅壺筆的蠟染布；刮掉後露出背景布上的字母
  const cv=mk("canvas","scratch","left:60px;top:120px;width:530px;height:450px",sc);cv.width=530;cv.height=450;const g=cv.getContext("2d");
  g.fillStyle="#3f5a4c";g.fillRect(0,0,530,450);
  const cloth=new Image();cloth.onload=()=>{const k=cloth.naturalWidth/1200;g.globalCompositeOperation="source-over";g.drawImage(cloth,(60-2)*k,120*k,530*k,450*k,0,0,530,450)};
  cloth.src=src("625c34165bc367001879284f/a9e9bb79-ba6b-4fc1-9493-07d98cd5c1e5.png");
  mk("div","","position:absolute;left:60px;top:80px;font-size:22px;color:#444;z-index:5",sc).textContent="用手指刮刮看布上的銅壺筆。";
  let down=false;const pt=e=>{const r=cv.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return[(t.clientX-r.left)*530/r.width,(t.clientY-r.top)*450/r.height]};
  const rub=e=>{if(!down)return;e.preventDefault();const[x,y]=pt(e);g.globalCompositeOperation="destination-out";g.beginPath();g.arc(x,y,26,0,7);g.fill()};
  cv.addEventListener("pointerdown",e=>{down=true;rub(e)});addEventListener("pointerup",()=>down=false);cv.addEventListener("pointermove",rub);
  // 螢幕與鍵盤
  const scr=mk("div","screen","left:794px;top:200px;width:174px;height:48px",sc);
  const pearl=img(sc,"625c34165bc367001879284f/83b4dcd7-36b6-4ba9-a0ae-d9bcf83ca103.png",913,35,151,151,0,40);
  const ph=hit(sc,913,35,151,151,next,"收下珍珠");
  let typed="",solved=false;
  const show=()=>{scr.textContent=typed||"_____";scr.style.color=""};
  "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").forEach((c,i)=>{const col=i%7,row=Math.floor(i/7);const k=mk("div","key","left:"+(722+col*48)+"px;top:"+(331+row*48)+"px;width:44px;height:44px",sc);k.textContent=c;
    k.onclick=()=>{if(solved||typed.length>=5)return;typed+=c;show();if(typed.length===5){
      if(typed==="BATIK"){solved=true;scr.textContent="BATIK 正確";scr.style.color="#7fe39a";pearl.classList.remove("hide");pearl.classList.add("pop","glow");ph.classList.remove("hide");toast("答對了！點右上角的珍珠")}
      else{scr.textContent="錯誤";scr.style.color="#ff7a6a";scr.classList.add("shake");setTimeout(()=>{scr.classList.remove("shake");typed="";show()},900)}}}});
  const bk=mk("div","key","left:"+(722+5*48)+"px;top:"+(331+3*48)+"px;width:92px;height:44px;font-size:18px",sc);bk.textContent="⌫";bk.onclick=()=>{if(solved)return;typed=typed.slice(0,-1);show()};
  api.enter=()=>{if(!solved){pearl.classList.add("hide");ph.classList.add("hide");typed="";show()}};
  navBack(sc);
  hintBtn(sc,["用手指在左邊的布上刮，特別是銅壺筆的位置。","每支銅壺筆底下藏著一個字母，排成印尼「蠟染」的名字。","把五個字母用鍵盤打在螢幕上。","答案：BATIK"]);
});

/* ===== 5 訪查報告三 ===== */
report({base:[["625c34165bc367001879284f/0fa07f31-e236-4dee-9a3b-8a82100ba25b.png",725,4,373,629,0,1],

    p.addEventListener("pointermove",e=>{if(!drag||drag.i!==i)return;const k=scale();let dx=e.clientX/k-drag.sx,dy=e.clientY/k-drag.sy;
      // 整組不要拖出畫面
      const xs=drag.start.map(s=>s[0]),ys=drag.start.map(s=>s[1]);dx=Math.max(-Math.min(...xs)-40,Math.min(1200-S+40-Math.max(...xs),dx));dy=Math.max(-Math.min(...ys)-40,Math.min(675-S+40-Math.max(...ys),dy));
